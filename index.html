<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Divine Chat — প্রিমিয়াম রিয়েলটাইম চ্যাট</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-body: 'Inter', sans-serif;
      --font-heading: 'Sora', sans-serif;
      --bg-dark: #090d16;
      --bg-surface: #0f172a;
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --bubble-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --surface-glass: rgba(15, 23, 42, 0.75);
      --surface-card: rgba(30, 41, 59, 0.7);
      --surface-input: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-light: rgba(255, 255, 255, 0.2);
      --glass-blur: blur(20px) saturate(180%);
      --status-online: #10b981;
      --status-error: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 14.5px;
    }

    /* Animated Ambient Mesh */
    .mesh-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 45%),
                  radial-gradient(circle at 90% 30%, rgba(236, 72, 153, 0.2) 0%, transparent 40%),
                  radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.22) 0%, transparent 50%),
                  var(--bg-dark);
      animation: meshAnim 20s ease infinite alternate;
    }
    @keyframes meshAnim {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ════════════ AUTH SCREEN ════════════ */
    .auth-wrap {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      animation: fadeIn 0.3s var(--ease);
    }
    .auth-card {
      position: relative;
      background: var(--surface-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 34px 26px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 35px -10px rgba(99, 102, 241, 0.35);
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--primary-gradient);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--primary-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.45);
    }
    .auth-title {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .auth-tabs {
      position: relative;
      display: flex;
      background: rgba(10, 15, 29, 0.65);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      margin-bottom: 18px;
    }
    .tab-slider {
      position: absolute;
      top: 4px; bottom: 4px; left: 4px;
      width: calc(50% - 4px);
      background: var(--primary-gradient);
      border-radius: 9px;
      transition: transform 0.25s var(--ease);
      box-shadow: 0 4px 10px rgba(99,102,241,0.3);
      pointer-events: none;
    }
    .tab-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font-heading);
    }
    .tab-btn.active { color: #fff; }

    .auth-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      margin-bottom: 14px;
      align-items: center;
      gap: 8px;
    }
    .auth-error.show { display: flex; }

    .input-box {
      position: relative;
      margin-bottom: 14px;
    }
    .input-field {
      width: 100%;
      background: var(--surface-input);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 13px 40px 13px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .input-label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 13px;
      pointer-events: none;
      transition: all 0.2s;
    }
    .input-field:focus ~ .input-label,
    .input-field:not(:placeholder-shown) ~ .input-label {
      top: 0;
      left: 10px;
      transform: translateY(-50%) scale(0.85);
      background: #0f172a;
      padding: 0 4px;
      color: #a5b4fc;
    }
    .input-toggle-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      font-family: var(--font-heading);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-main {
      width: 100%;
      padding: 13px;
      background: var(--primary-gradient);
      color: #fff;
      font-size: 14px;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 14px;
      color: var(--text-subtle);
      font-size: 11.5px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-social {
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 12.5px;
    }
    .btn-social:hover { background: rgba(255, 255, 255, 0.1); }

    /* ════════════ CHAT LAYOUT ════════════ */
    .chat-layout {
      width: 100%;
      height: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
      box-shadow: 0 0 70px rgba(0,0,0,0.5);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--surface-glass);
      border-bottom: 1px solid var(--glass-border);
      z-index: 10;
    }
    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-box {
      position: relative;
      width: 40px;
      height: 40px;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      background: var(--primary-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: var(--font-heading);
      border: 1px solid var(--glass-border-light);
    }
    .online-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 11px;
      height: 11px;
      background: var(--status-online);
      border: 2px solid var(--bg-surface);
      border-radius: 50%;
    }
    .header-info h2 {
      font-size: 15px;
      font-family: var(--font-heading);
      font-weight: 700;
      color: #fff;
    }
    .header-info span {
      font-size: 11px;
      color: var(--status-online);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }
    .messages-area::-webkit-scrollbar { width: 5px; }
    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
    }

    .date-badge {
      align-self: center;
      margin: 10px 0 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border);
      padding: 3px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .empty-state {
      margin: auto;
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      max-width: 320px;
    }
    .empty-state svg { margin-bottom: 12px; color: #a5b4fc; }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 80%;
      animation: msgIn 0.2s var(--ease);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.own {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.other {
      align-self: flex-start;
    }

    .bubble-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .msg-sender {
      font-size: 11px;
      font-weight: 600;
      color: #a5b4fc;
      margin: 0 0 3px 8px;
    }
    .msg-bubble {
      position: relative;
      padding: 9px 13px;
      border-radius: 16px;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.45;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .msg-row.own .msg-bubble {
      background: var(--bubble-gradient);
      color: #fff;
      border-bottom-right-radius: 3px;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .msg-row.other .msg-bubble {
      background: var(--surface-card);
      color: var(--text-main);
      border-bottom-left-radius: 3px;
      border: 1px solid var(--glass-border);
    }
    .msg-bubble.deleted {
      font-style: italic;
      color: var(--text-subtle) !important;
      background: rgba(255, 255, 255, 0.04) !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
    }

    .msg-quote {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid #fff;
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 6px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .msg-row.other .msg-quote {
      border-left-color: var(--primary);
      background: rgba(255, 255, 255, 0.06);
    }
    .quote-author { font-weight: 700; font-size: 10.5px; }
    .quote-content {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      opacity: 0.85;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 3px;
      font-size: 10px;
      opacity: 0.75;
    }

    /* Actions Hover Bar */
    .msg-actions {
      position: absolute;
      top: -12px;
      display: none;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--glass-border-light);
      border-radius: 10px;
      padding: 2px 4px;
      z-index: 5;
      gap: 2px;
    }
    .msg-row.own .msg-actions { right: 6px; }
    .msg-row.other .msg-actions { left: 6px; }
    .bubble-wrapper:hover .msg-actions { display: flex; }

    .act-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 5px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .act-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .act-btn.del:hover { color: #f87171; }

    /* Media Messages */
    .msg-img-wrap {
      border-radius: 10px;
      overflow: hidden;
      max-width: 280px;
      max-height: 320px;
      cursor: zoom-in;
    }
    .msg-img-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .msg-file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.2);
      text-decoration: none;
      color: inherit;
      min-width: 220px;
    }
    .file-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .file-meta { flex: 1; overflow: hidden; }
    .file-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size { font-size: 10.5px; opacity: 0.7; }

    /* Voice Player */
    .voice-player {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      padding: 4px 0;
    }
    .voice-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .msg-row.other .voice-btn {
      background: var(--primary-gradient);
      color: #fff;
    }
    .voice-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .voice-waves {
      height: 20px;
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .v-bar {
      flex: 1;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      transition: background 0.15s;
    }
    .v-bar.played { background: #fff; }
    .msg-row.other .v-bar.played { background: var(--primary); }
    .voice-info {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      opacity: 0.8;
    }
    .voice-speed {
      font-weight: 700;
      background: rgba(0,0,0,0.25);
      padding: 1px 4px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Scroll to bottom */
    .scroll-btn {
      position: absolute;
      bottom: 80px;
      right: 20px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface-card);
      border: 1px solid var(--glass-border-light);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
    }
    .scroll-btn.show { opacity: 1; pointer-events: auto; }

    /* Input Footer */
    .chat-footer {
      position: relative;
      background: var(--surface-glass);
      border-top: 1px solid var(--glass-border);
      padding: 8px 14px 12px;
    }
    .upload-bar-wrap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.06);
      display: none;
    }
    .upload-bar-wrap.show { display: block; }
    .upload-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-gradient);
    }

    .preview-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--primary);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .preview-bar.show { display: flex; }
    .preview-title { font-weight: 700; color: #a5b4fc; }
    .preview-txt {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .textarea-box {
      flex: 1;
      background: var(--surface-input);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 7px 12px;
      display: flex;
    }
    .chat-textarea {
      width: 100%;
      max-height: 120px;
      min-height: 24px;
      height: 24px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      font-family: var(--font-body);
      resize: none;
      outline: none;
    }
    .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-send:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Voice Recording Bar */
    .rec-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 18px;
      padding: 6px 12px;
    }
    .rec-bar.show { display: flex; }
    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rec-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: recBlink 1s infinite;
    }
    @keyframes recBlink {
      50% { opacity: 0.3; transform: scale(1.2); }
    }
    .rec-timer { font-weight: 700; font-size: 13px; }

    /* Popovers */
    .popover {
      position: absolute;
      bottom: 58px;
      background: var(--surface-card);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border-light);
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      display: none;
      z-index: 30;
    }
    .popover.show { display: flex; }
    .attach-menu {
      left: 10px;
      flex-direction: column;
      padding: 6px;
      width: 160px;
      gap: 2px;
    }
    .attach-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
    }
    .attach-item:hover { background: rgba(255,255,255,0.1); }

    .emoji-popover {
      left: 45px;
      width: 300px;
      max-height: 300px;
      flex-direction: column;
      padding: 10px;
    }
    .emoji-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 4px;
    }
    .e-tab {
      background: none;
      border: none;
      font-size: 15px;
      padding: 3px 6px;
      cursor: pointer;
      opacity: 0.6;
    }
    .e-tab.active { opacity: 1; }
    .emoji-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      max-height: 220px;
    }
    .e-btn {
      background: none;
      border: none;
      font-size: 20px;
      padding: 4px;
      cursor: pointer;
      border-radius: 6px;
    }
    .e-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.2); }

    /* Toasts */
    .toast-box {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 250px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--glass-border-light);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;

      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.25s var(--ease);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(30px); } }
    .toast.success { border-left: 3px solid var(--status-online); }
    .toast.error { border-left: 3px solid var(--status-error); }
    .toast.info { border-left: 3px solid var(--primary); }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;

      padding: 16px;
    }
    .modal.show { display: flex; }

    }
    .modal-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .confirm-box {
      width: 100%;
      max-width: 340px;
      background: var(--surface-card);
      border: 1px solid var(--glass-border-light);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
    }
    .confirm-box h3 { margin-bottom: 6px; font-family: var(--font-heading); }
    .confirm-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions .btn { flex: 1; padding: 9px; font-size: 13px; }
  </style>
</head>

  <!-- ════════════ FIREBASE LOGIC ════════════ -->
  <script type="module">

    // 🎯 আপনার দেওয়া আসল Firebase কনফিগারেশন সরাসরি যুক্ত করা হয়েছে
    const firebaseConfig = {

    };

    // Firebase Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // DOM Elements
    const els = {
      authSection: document.getElementById('authSection'),
      chatSection: document.getElementById('chatSection'),
      authForm: document.getElementById('authForm'),
      tabLoginBtn: document.getElementById('tabLoginBtn'),
      tabSignupBtn: document.getElementById('tabSignupBtn'),
      tabSlider: document.getElementById('tabSlider'),
      nameBox: document.getElementById('nameBox'),
      nameInput: document.getElementById('nameInput'),
      emailInput: document.getElementById('emailInput'),
      passwordInput: document.getElementById('passwordInput'),
      togglePass: document.getElementById('togglePass'),
      authBtn: document.getElementById('authBtn'),

      replySnippet: document.getElementById('replySnippet'),
      cancelReply: document.getElementById('cancelReply'),
      editBar: document.getElementById('editBar'),
      editSnippet: document.getElementById('editSnippet'),
      cancelEdit: document.getElementById('cancelEdit'),
      inputRow: document.getElementById('inputRow'),
      chatInput: document.getElementById('chatInput'),
      sendBtn: document.getElementById('sendBtn'),
      micBtn: document.getElementById('micBtn'),
      recBar: document.getElementById('recBar'),
      recTimer: document.getElementById('recTimer'),
      cancelRec: document.getElementById('cancelRec'),
      sendRec: document.getElementById('sendRec'),
      attachBtn: document.getElementById('attachBtn'),
      attachMenu: document.getElementById('attachMenu'),
      pickImg: document.getElementById('pickImg'),
      pickDoc: document.getElementById('pickDoc'),
      pickAny: document.getElementById('pickAny'),
      imgInput: document.getElementById('imgInput'),
      docInput: document.getElementById('docInput'),
      fileInput: document.getElementById('fileInput'),
      emojiBtn: document.getElementById('emojiBtn'),
      emojiPopover: document.getElementById('emojiPopover'),
      emojiGrid: document.getElementById('emojiGrid'),
      toastBox: document.getElementById('toastBox'),
      imageModal: document.getElementById('imageModal'),
      modalImg: document.getElementById('modalImg'),
      closeImgModal: document.getElementById('closeImgModal'),
      deleteModal: document.getElementById('deleteModal'),
      cancelDel: document.getElementById('cancelDel'),
      confirmDel: document.getElementById('confirmDel')
    };

    // App State
    let currentUser = null;
    let isLoginMode = true;
    let messagesUnsub = null;
    let activeReply = null;
    let activeEdit = null;
    let pendingDelete = null;
    let activeAudio = null;
    let activeAudioId = null;

    // Audio Recorder State
    let mediaRecorder = null;
    let audioChunks = [];
    let recTimer = null;
    let recStart = 0;
    let recordedBlob = null;
    let recordedDuration = 0;

    const EMOJIS = {
      smileys: ["😀","😁","😂","🤣","😃","😄","😅","😆","😉","😊","😋","😎","😍","😘","🥰","😗","😙","😚","🙂","🤗","🤩","🤔","🤨","😐","😑","🙄","😏","😣","😮","🤐","😴","😌","😛","😜","🤪","🤤","😒","😔","🙃","🤑","😲","☹️","😭","😱","😡","😠","😇"],
      gestures: ["👋","🤚","🖐️","✋","👌","🤌","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","👇","👍","👎","✊","👊","👏","🙌","🤝","🙏","✍️","💪"],
      hearts: ["❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","💌","💋","😻","🫶"],
      objects: ["🎉","🎊","🎈","🎂","🎁","🎇","🏆","🥇","⚽","🏀","🚀","✈️","🔥","⭐","🌟","✨","💡","📱","💻","📷","🎧","📚","☕","🍕","🍔","🍻"]
    };

    const WAVE_BARS = [30, 60, 45, 80, 100, 75, 40, 65, 85, 50, 95, 70, 35, 60, 80, 50, 30, 70, 90, 40];

    // Helper functions
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return 'আজ';
      const yest = new Date(now); yest.setDate(now.getDate() - 1);
      if (d.toDateString() === yest.toDateString()) return 'গতকাল';
      return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024, i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + ['B','KB','MB','GB'][i];
    }

    function formatDuration(sec) {
      const s = Math.floor(sec || 0);
      const m = Math.floor(s / 60);
      return `${m < 10 ? '0' : ''}${m}:${(s % 60) < 10 ? '0' : ''}${s % 60}`;
    }

    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      els.toastBox.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }

    function mapAuthError(code) {
      switch (code) {
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'পাসওয়ার্ড বা ইমেইল ভুল হয়েছে।';
        case 'auth/user-not-found': return 'অ্যাকাউন্ট পাওয়া যায়নি।';
        case 'auth/email-already-in-use': return 'ইমেইলটি ইতিমধ্যে ব্যবহৃত হচ্ছে।';
        case 'auth/weak-password': return 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।';
        case 'auth/invalid-email': return 'সঠিক ইমেইল এড্রেস দিন।';
        case 'auth/popup-closed-by-user': return 'লগইন উইন্ডো বন্ধ করা হয়েছে।';
        default: return 'লগইনে সমস্যা হয়েছে। আবার চেষ্টা করুন।';
      }
    }

    function scrollToBottom() {
      els.messagesArea.scrollTo({ top: els.messagesArea.scrollHeight, behavior: 'smooth' });
    }

    /* ════════════ AUTH MODULE ════════════ */
    els.tabLoginBtn.onclick = () => switchAuth(true);
    els.tabSignupBtn.onclick = () => switchAuth(false);

    function switchAuth(isLogin) {
      isLoginMode = isLogin;
      els.authError.classList.remove('show');
      if (isLogin) {
        els.tabLoginBtn.classList.add('active');
        els.tabSignupBtn.classList.remove('active');
        els.tabSlider.style.transform = 'translateX(0)';
        els.nameBox.style.display = 'none';
        els.authBtn.textContent = 'লগইন করুন';
      } else {
        els.tabSignupBtn.classList.add('active');
        els.tabLoginBtn.classList.remove('active');
        els.tabSlider.style.transform = 'translateX(100%)';
        els.nameBox.style.display = 'block';
        els.authBtn.textContent = 'নিবন্ধন করুন';
      }
    }

    els.togglePass.onclick = () => {
      const isPass = els.passwordInput.type === 'password';
      els.passwordInput.type = isPass ? 'text' : 'password';
    };

    els.authForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = els.emailInput.value.trim();
      const pass = els.passwordInput.value;
      const name = els.nameInput.value.trim();

      els.authError.classList.remove('show');
      els.authBtn.disabled = true;

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, pass);
          showToast('লগইন সফল হয়েছে', 'success');
        } else {
          if (!name) throw { code: 'custom/name-missing', message: 'নাম লিখুন' };
          const res = await createUserWithEmailAndPassword(auth, email, pass);
          await updateProfile(res.user, { displayName: name });
          showToast('অ্যাকাউন্ট তৈরি সম্পন্ন!', 'success');
        }
      } catch (err) {
        els.authErrorText.textContent = err.code === 'custom/name-missing' ? 'আপনার নাম লিখুন' : mapAuthError(err.code);
        els.authError.classList.add('show');
      } finally {
        els.authBtn.disabled = false;
      }
    };

    els.googleBtn.onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
        showToast('গুগল দিয়ে লগইন সফল!', 'success');
      } catch (err) {
        showToast(mapAuthError(err.code), 'error');
      }
    };

    els.guestBtn.onclick = async () => {
      try {
        await signInAnonymously(auth);
        showToast('গেস্ট মোডে স্বাগতম', 'info');
      } catch (err) {
        showToast(mapAuthError(err.code), 'error');
      }
    };

    els.logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        els.authSection.style.display = 'none';
        els.chatSection.style.display = 'flex';
        const dName = user.displayName || (user.isAnonymous ? 'গেস্ট ইউজার' : user.email.split('@')[0]);
        els.userName.textContent = dName;
        if (user.photoURL) {
          els.userAvatar.innerHTML = `<img src="${user.photoURL}" class="avatar" />`;
        } else {
          els.userAvatar.textContent = dName.charAt(0).toUpperCase();
        }
        initMessages();
      } else {
        if (messagesUnsub) messagesUnsub();
        els.chatSection.style.display = 'none';
        els.authSection.style.display = 'block';
      }
    });

    /* ════════════ CHAT REALTIME ════════════ */
    function initMessages() {
      const q = query(collection(db, 'messages'), orderBy('createdAt', 'asc'), limit(150));
      messagesUnsub = onSnapshot(q, (snap) => {
        if (snap.empty) {
          els.emptyChat.style.display = 'block';
          els.messagesArea.querySelectorAll('.msg-row, .date-badge').forEach(e => e.remove());
          return;
        }
        els.emptyChat.style.display = 'none';
        renderMessages(snap.docs);
        scrollToBottom();
      }, (err) => {
        console.error(err);
        showToast('মেসেজ লোড হতে ব্যর্থ হয়েছে', 'error');
      });
    }

    function renderMessages(docs) {
      els.messagesArea.querySelectorAll('.msg-row, .date-badge').forEach(e => e.remove());
      let lastDate = null;

      docs.forEach((d) => {
        const msg = { id: d.id, ...d.data() };
        const dateStr = formatDate(msg.createdAt);

        if (dateStr && dateStr !== lastDate) {
          const badge = document.createElement('div');
          badge.className = 'date-badge';
          badge.textContent = dateStr;
          els.messagesArea.appendChild(badge);
          lastDate = dateStr;
        }

        const isOwn = currentUser && msg.senderId === currentUser.uid;
        const row = document.createElement('div');
        row.className = `msg-row ${isOwn ? 'own' : 'other'}`;
        row.id = `msg-${msg.id}`;

        let bodyHtml = '';
        if (msg.deleted) {
          bodyHtml = `<div class="msg-bubble deleted">🚫 এই মেসেজ মুছে ফেলা হয়েছে</div>`;
        } else {
          let mediaHtml = '';
          if (msg.type === 'image') {
            mediaHtml = `<div class="msg-img-wrap" data-url="${msg.mediaUrl}"><img src="${msg.mediaUrl}" class="msg-img-thumb" loading="lazy" /></div>`;
          } else if (msg.type === 'voice') {
            const bars = WAVE_BARS.map(h => `<div class="v-bar" style="height:${h}%;"></div>`).join('');
            mediaHtml = `
              <div class="voice-player" data-url="${msg.mediaUrl}" data-id="${msg.id}" data-dur="${msg.duration||0}">
                <button class="voice-btn" type="button">▶</button>
                <div class="voice-body">
                  <div class="voice-waves">${bars}</div>
                  <div class="voice-info">
                    <span class="v-time">00:00 / ${formatDuration(msg.duration)}</span>
                    <span class="voice-speed">1x</span>
                  </div>
                </div>
              </div>`;
          } else if (msg.type === 'file') {
            mediaHtml = `
              <a href="${msg.mediaUrl}" target="_blank" class="msg-file-card" download="${escapeHtml(msg.mediaName)}">
                <div class="file-icon">📄</div>
                <div class="file-meta">
                  <div class="file-name">${escapeHtml(msg.mediaName)}</div>
                  <div class="file-size">${formatBytes(msg.mediaSize)}</div>
                </div>
                <span>⬇️</span>
              </a>`;
          }

          let quoteHtml = '';
          if (msg.replyTo) {
            quoteHtml = `
              <div class="msg-quote" data-target="${msg.replyTo.messageId}">
                <div class="quote-author">${escapeHtml(msg.replyTo.senderName)}</div>
                <div class="quote-content">${escapeHtml(msg.replyTo.text || 'ফাইল')}</div>
              </div>`;
          }

          const txtHtml = msg.text ? `<div style="white-space:pre-wrap;">${escapeHtml(msg.text)}</div>` : '';

          bodyHtml = `
            <div class="bubble-wrapper">
              ${!isOwn ? `<div class="msg-sender">${escapeHtml(msg.senderName)}</div>` : ''}
              <div class="msg-actions">
                <button class="act-btn" data-act="reply" title="উত্তর">↩️</button>
                ${msg.type === 'text' ? '<button class="act-btn" data-act="copy" title="কপি">📋</button>' : ''}
                ${isOwn && msg.type === 'text' ? '<button class="act-btn" data-act="edit" title="এডিট">✏️</button>' : ''}
                ${isOwn ? '<button class="act-btn del" data-act="del" title="মুছুন">🗑️</button>' : ''}
              </div>
              <div class="msg-bubble">
                ${quoteHtml}
                ${mediaHtml}
                ${txtHtml}
                <div class="msg-meta">
                  ${msg.edited ? '<span>(সম্পাদিত)</span>' : ''}
                  <span>${formatTime(msg.createdAt)}</span>
                </div>
              </div>
            </div>`;
        }

        row.innerHTML = bodyHtml;
        els.messagesArea.appendChild(row);
      });
    }

    /* ════════════ SENDING ACTIONS ════════════ */
    async function sendMessage() {
      const text = els.chatInput.value.trim();
      if (!text || !currentUser) return;

      if (activeEdit) {
        try {
          await updateDoc(doc(db, 'messages', activeEdit.id), {
            text: text,
            edited: true,
            updatedAt: serverTimestamp()
          });
          cancelEditMode();
          showToast('মেসেজ সম্পাদিত হয়েছে', 'success');
        } catch (err) {
          showToast('এডিট ব্যর্থ হয়েছে', 'error');
        }
        return;
      }

      const payload = {
        text: text,
        senderId: currentUser.uid,
        senderName: currentUser.displayName || (currentUser.isAnonymous ? 'গেস্ট' : currentUser.email.split('@')[0]),
        createdAt: serverTimestamp(),
        type: 'text',
        replyTo: activeReply ? {
          messageId: activeReply.id,
          senderName: activeReply.senderName,
          text: activeReply.text
        } : null,
        edited: false,
        deleted: false
      };

      els.chatInput.value = '';
      els.chatInput.style.height = '24px';
      els.sendBtn.disabled = true;
      cancelReplyMode();

      try {
        await addDoc(collection(db, 'messages'), payload);
      } catch (err) {
        showToast('মেসেজ পাঠানো যায়নি', 'error');
      }
    }

    async function uploadMedia(file, type) {
      if (!file || !currentUser) return;
      const isVoice = type === 'voice';
      const maxMb = type === 'image' ? 5 : 10;

      if (file.size > maxMb * 1024 * 1024) {
        showToast(`সর্বোচ্চ ${maxMb}MB ফাইল দিতে পারবেন`, 'error');
        return;
      }

      const ext = isVoice ? 'webm' : file.name.split('.').pop();
      const path = `chat-${type}s/${currentUser.uid}/${Date.now()}.${ext}`;
      const fileRef = ref(storage, path);
      const task = uploadBytesResumable(fileRef, file);

      els.uploadWrap.classList.add('show');

      task.on('state_changed',
        (s) => {
          const p = (s.bytesTransferred / s.totalBytes) * 100;
          els.uploadBar.style.width = p + '%';
        },
        () => {
          els.uploadWrap.classList.remove('show');
          showToast('আপলোড ব্যর্থ হয়েছে', 'error');
        },
        async () => {
          const url = await getDownloadURL(task.snapshot.ref);
          els.uploadWrap.classList.remove('show');
          els.uploadBar.style.width = '0%';

          await addDoc(collection(db, 'messages'), {
            text: '',
            senderId: currentUser.uid,
            senderName: currentUser.displayName || 'ব্যবহারকারী',
            createdAt: serverTimestamp(),
            type: type,
            mediaUrl: url,
            mediaName: file.name || `voice_${Date.now()}.webm`,
            mediaSize: file.size,
            duration: isVoice ? Math.round(recordedDuration) : null,
            replyTo: activeReply ? { messageId: activeReply.id, senderName: activeReply.senderName, text: activeReply.text } : null,
            edited: false,
            deleted: false
          });
          cancelReplyMode();
          showToast('ফাইল সফলভাবে পাঠানো হয়েছে', 'success');
        }
      );
    }

    /* ════════════ VOICE RECORDING ════════════ */
    async function startVoiceRec() {
      if (!navigator.mediaDevices?.getUserMedia) {
        showToast('মাইক্রোফোন ব্রাউজারে সমর্থিত নয়', 'error');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (audioChunks.length > 0) {
            recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
          }
        };

        mediaRecorder.start();
        recStart = Date.now();
        els.inputRow.style.display = 'none';
        els.recBar.classList.add('show');
        els.recTimer.textContent = '00:00';

        recTimer = setInterval(() => {
          recordedDuration = (Date.now() - recStart) / 1000;
          els.recTimer.textContent = formatDuration(recordedDuration);
          if (recordedDuration >= 120) stopVoiceRec(false);
        }, 500);
      } catch (err) {
        showToast('মাইক পারমিশন দেওয়া হয়নি', 'error');
      }
    }

    function stopVoiceRec(cancel = false) {
      if (recTimer) clearInterval(recTimer);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      els.recBar.classList.remove('show');
      els.inputRow.style.display = 'flex';

      if (cancel) {
        recordedBlob = null;
        showToast('রেকর্ড বাতিল করা হয়েছে', 'info');
      } else {
        setTimeout(() => {
          if (recordedBlob) uploadMedia(recordedBlob, 'voice');
          recordedBlob = null;
        }, 200);
      }
    }

    /* ════════════ AUDIO PLAYER ════════════ */
    function toggleVoice(player) {
      const url = player.dataset.url;
      const id = player.dataset.id;
      const btn = player.querySelector('.voice-btn');
      const timeLbl = player.querySelector('.v-time');
      const bars = player.querySelectorAll('.v-bar');
      const dur = parseFloat(player.dataset.dur) || 0;

      if (activeAudio && activeAudioId === id) {
        if (activeAudio.paused) {
          activeAudio.play();
          btn.textContent = '⏸';
        } else {
          activeAudio.pause();
          btn.textContent = '▶';
        }
        return;
      }

      if (activeAudio) {
        activeAudio.pause();
        document.querySelectorAll('.voice-btn').forEach(b => b.textContent = '▶');
      }

      const a = new Audio(url);
      activeAudio = a;
      activeAudioId = id;
      btn.textContent = '⏸';
      a.play();

      a.ontimeupdate = () => {
        timeLbl.textContent = `${formatDuration(a.currentTime)} / ${formatDuration(dur)}`;
        const pct = a.currentTime / (a.duration || dur);
        const curIdx = Math.floor(pct * bars.length);
        bars.forEach((b, i) => b.classList.toggle('played', i <= curIdx));
      };

      a.onended = () => {
        btn.textContent = '▶';
        timeLbl.textContent = `00:00 / ${formatDuration(dur)}`;
        bars.forEach(b => b.classList.remove('played'));
        activeAudio = null;
      };

      player.querySelector('.voice-speed').onclick = (e) => {
        e.stopPropagation();
        a.playbackRate = a.playbackRate === 1 ? 1.5 : (a.playbackRate === 1.5 ? 2 : 1);
        e.target.textContent = a.playbackRate + 'x';
      };
    }

    /* ════════════ EVENT LISTENERS ════════════ */
    els.chatInput.oninput = () => {
      els.chatInput.style.height = 'auto';
      els.chatInput.style.height = Math.min(els.chatInput.scrollHeight, 120) + 'px';
      els.sendBtn.disabled = !els.chatInput.value.trim();
    };

    els.chatInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!els.sendBtn.disabled) sendMessage();
      }
    };

    els.sendBtn.onclick = sendMessage;

    // Attachments
    els.attachBtn.onclick = (e) => {
      e.stopPropagation();
      els.emojiPopover.classList.remove('show');
      els.attachMenu.classList.toggle('show');
    };
    els.pickImg.onclick = () => { els.attachMenu.classList.remove('show'); els.imgInput.click(); };
    els.pickDoc.onclick = () => { els.attachMenu.classList.remove('show'); els.docInput.click(); };
    els.pickAny.onclick = () => { els.attachMenu.classList.remove('show'); els.fileInput.click(); };

    els.imgInput.onchange = e => { if (e.target.files[0]) uploadMedia(e.target.files[0], 'image'); e.target.value = ''; };
    els.docInput.onchange = e => { if (e.target.files[0]) uploadMedia(e.target.files[0], 'file'); e.target.value = ''; };
    els.fileInput.onchange = e => { if (e.target.files[0]) uploadMedia(e.target.files[0], 'file'); e.target.value = ''; };

    // Voice Record
    els.micBtn.onclick = startVoiceRec;
    els.cancelRec.onclick = () => stopVoiceRec(true);
    els.sendRec.onclick = () => stopVoiceRec(false);

    // Emoji Picker
    els.emojiBtn.onclick = (e) => {
      e.stopPropagation();
      els.attachMenu.classList.remove('show');
      els.emojiPopover.classList.toggle('show');
      loadEmojis('smileys');
    };
    function loadEmojis(cat) {
      els.emojiGrid.innerHTML = (EMOJIS[cat] || []).map(em => `<button class="e-btn" type="button">${em}</button>`).join('');
    }
    document.querySelectorAll('.e-tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.e-tab').forEach(b => b.classList.remove('active'));
        t.classList.add('active');
        loadEmojis(t.dataset.cat);
      };
    });
    els.emojiGrid.onclick = e => {
      if (e.target.classList.contains('e-btn')) {
        els.chatInput.value += e.target.textContent;
        els.sendBtn.disabled = false;
        els.chatInput.focus();
      }
    };

    // Outside click closes popovers
    document.onclick = e => {
      if (!els.attachMenu.contains(e.target) && e.target !== els.attachBtn) els.attachMenu.classList.remove('show');
      if (!els.emojiPopover.contains(e.target) && e.target !== els.emojiBtn) els.emojiPopover.classList.remove('show');
    };

    // Reply & Edit controls
    function cancelReplyMode() { activeReply = null; els.replyBar.classList.remove('show'); }
    function cancelEditMode() {
      activeEdit = null;
      els.editBar.classList.remove('show');
      els.chatInput.value = '';
      els.chatInput.style.height = '24px';
      els.sendBtn.disabled = true;
    }
    els.cancelReply.onclick = cancelReplyMode;
    els.cancelEdit.onclick = cancelEditMode;

    // Messages Area Click Actions
    els.messagesArea.onclick = e => {
      const img = e.target.closest('.msg-img-wrap');
      if (img) {
        els.modalImg.src = img.dataset.url;
        els.imageModal.classList.add('show');
        return;
      }
      const vp = e.target.closest('.voice-btn');
      if (vp) {
        toggleVoice(vp.closest('.voice-player'));
        return;
      }
      const q = e.target.closest('.msg-quote');
      if (q) {
        const target = document.getElementById(`msg-${q.dataset.target}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      const act = e.target.closest('.act-btn');
      if (act) {
        const row = act.closest('.msg-row');
        const id = row.id.replace('msg-', '');
        const text = row.querySelector('.msg-bubble')?.innerText || '';
        const sender = row.querySelector('.msg-sender')?.innerText || 'ব্যবহারকারী';

        if (act.dataset.act === 'reply') {
          activeReply = { id, senderName: sender, text };
          cancelEditMode();
          els.replySender.textContent = `উত্তরে: ${sender}`;
          els.replySnippet.textContent = text;
          els.replyBar.classList.add('show');
          els.chatInput.focus();
        } else if (act.dataset.act === 'copy') {
          navigator.clipboard.writeText(text);
          showToast('মেসেজ কপি হয়েছে', 'info');
        } else if (act.dataset.act === 'edit') {
          activeEdit = { id, text };
          cancelReplyMode();
          els.editSnippet.textContent = text;
          els.editBar.classList.add('show');
          els.chatInput.value = text;
          els.sendBtn.disabled = false;
          els.chatInput.focus();
        } else if (act.dataset.act === 'del') {
          pendingDelete = id;
          els.deleteModal.classList.add('show');
        }
      }
    };

    // Modals
    els.closeImgModal.onclick = () => els.imageModal.classList.remove('show');
    els.cancelDel.onclick = () => els.deleteModal.classList.remove('show');
    els.confirmDel.onclick = async () => {
      if (!pendingDelete) return;
      try {
        await updateDoc(doc(db, 'messages', pendingDelete), {
          deleted: true,
          text: '',
          mediaUrl: null
        });
        showToast('মেসেজ মুছে ফেলা হয়েছে', 'info');
      } catch (err) {
        showToast('মুছতে ব্যর্থ হয়েছে', 'error');
      }
      els.deleteModal.classList.remove('show');
      pendingDelete = null;
    };

    // Scroll to bottom helper
    els.messagesArea.onscroll = () => {
      const nearBottom = els.messagesArea.scrollHeight - els.messagesArea.scrollTop - els.messagesArea.clientHeight < 120;
      els.scrollBottomBtn.classList.toggle('show', !nearBottom);
    };
    els.scrollBottomBtn.onclick = scrollToBottom;
  </script>
</body>
</html>
