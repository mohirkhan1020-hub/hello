<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌸 Divine Studio — Ultra HD Video Call</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-body: 'Inter', sans-serif;
      --font-head: 'Sora', sans-serif;
      --bg-dark: #090813;
      --card-bg: rgba(25, 20, 44, 0.88);
      --input-bg: rgba(16, 13, 28, 0.95);
      --pink: #f472b6;
      --pink-glow: rgba(244, 114, 182, 0.4);
      --cute-grad: linear-gradient(135deg, #f472b6 0%, #c084fc 50%, #6366f1 100%);
      --bubble-grad: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      --glass-border: rgba(255, 255, 255, 0.12);
      --online: #10b981;
      --text: #fdf2f8;
      --muted: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); font-size: 14px; }

    .mesh-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(circle at 10% 20%, rgba(244, 114, 182, 0.18) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.18) 0%, transparent 40%), var(--bg-dark);
    }

    #app { position: relative; z-index: 1; width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; }

    /* CHAT LAYOUT */
    .chat-layout {
      width: 100%; height: 100%; max-width: 920px; display: flex; flex-direction: column;
      background: rgba(16, 13, 28, 0.7); border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
    }

    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--card-bg); border-bottom: 1px solid var(--glass-border); z-index: 10;
    }
    .user-profile-btn {
      display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; color: inherit; text-align: left;
    }
    .avatar {
      position: relative; width: 40px; height: 40px; border-radius: 14px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff;
    }
    .online-dot {
      position: absolute; bottom: -2px; right: -2px; width: 11px; height: 11px;
      background: var(--online); border: 2px solid var(--bg-dark); border-radius: 50%;
    }
    .user-text h2 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .user-text span { font-size: 11px; color: var(--pink); display: block; }

    .hdr-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05); color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 15px; transition: 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .call-btn-audio { color: #38bdf8; }
    .call-btn-video { color: #f472b6; }
    .btn-help { color: #fbbf24; }

    .msg-area {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px; display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }
    .msg-area::-webkit-scrollbar { width: 4px; }
    .msg-area::-webkit-scrollbar-thumb { background: rgba(244, 114, 182, 0.2); border-radius: 8px; }

    .msg-row { display: flex; gap: 6px; max-width: 85%; animation: popBubble 0.18s ease; }
    .msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    @keyframes popBubble { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .b-wrap { position: relative; display: flex; flex-direction: column; }
    .b-sender { font-size: 11px; font-weight: 700; color: var(--pink); margin: 0 0 2px 6px; }
    .bubble {
      position: relative; padding: 9px 13px; border-radius: 18px; word-break: break-word; font-size: 13.5px; line-height: 1.4;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .msg-row.own .bubble { background: var(--bubble-grad); color: #fff; border-bottom-right-radius: 3px; }
    .msg-row.other .bubble { background: var(--card-bg); color: var(--text); border-bottom-left-radius: 3px; border: 1px solid var(--glass-border); }

    .b-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; font-size: 9.5px; opacity: 0.75; }
    .msg-img { max-width: 240px; max-height: 250px; border-radius: 12px; cursor: zoom-in; display: block; }

    .chat-footer { position: relative; background: var(--card-bg); border-top: 1px solid var(--glass-border); padding: 8px 10px; }
    .reply-bar {
      display: none; justify-content: space-between; align-items: center;
      padding: 4px 8px; font-size: 11.5px; color: var(--pink); border-left: 3px solid var(--pink); margin-bottom: 6px;
    }
    .reply-bar.show { display: flex; }

    .input-row { display: flex; align-items: flex-end; gap: 6px; }
    .inp-box {
      flex: 1; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 18px;
      padding: 6px 12px; display: flex; align-items: center;
    }
    .chat-txt {
      width: 100%; max-height: 85px; min-height: 24px; height: 24px; background: transparent;
      border: none; color: #fff; font-size: 13.5px; font-family: var(--font-body); resize: none; outline: none;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 12px; background: var(--cute-grad);
      border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .popover {
      position: absolute; bottom: 56px; background: rgba(25, 20, 42, 0.96);
      border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none; z-index: 30;
    }
    .popover.show { display: flex; }
    .attach-menu { left: 10px; flex-direction: column; padding: 6px; width: 160px; gap: 3px; }
    .att-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: none;
      border: none; color: var(--text); font-size: 12.5px; border-radius: 8px; cursor: pointer; text-align: left;
    }
    .att-item:hover { background: rgba(244, 114, 182, 0.15); }

    .emoji-pop { left: 40px; width: 280px; max-height: 220px; flex-direction: column; padding: 8px; }
    .emoji-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .e-btn { background: none; border: none; font-size: 19px; padding: 4px; cursor: pointer; border-radius: 6px; }

    /* 🚀 ULTRA HD CALL OVERLAY - SPECIFICATION BASED */
    .call-overlay {
      position: fixed; inset: 0; background: #000; z-index: 20000;
      display: none; flex-direction: column; align-items: center; justify-content: space-between; 
      padding: env(safe-area-inset-top, 20px) 0 env(safe-area-inset-bottom, 30px) 0;
      transition: all 0.3s ease;
    }
    .call-overlay.show { display: flex; }

    /* Remote Video - Fullscreen Edge-to-Edge */
    .remote-video-container {
      position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
      background: #111; overflow: hidden;
    }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }

    /* Self View - Draggable Box */
    .self-view-container {
      position: absolute; top: 20px; right: 20px; width: 120px; height: 180px;
      z-index: 30; cursor: move; touch-action: none;
      border: 2px solid #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #localVideo { width: 100%; height: 100%; object-fit: cover; }

    /* Top Bar */
    .call-top-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 40; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .call-user-info { display: flex; flex-direction: column; align-items: center; position: absolute; left: 50%; transform: translateX(-50%); }
    .call-user-name { font-family: var(--font-head); font-size: 16px; color: #fff; font-weight: 600; }
    .call-timer { font-size: 14px; color: #E0E0E0; }

    .top-actions { display: flex; gap: 12px; }
    .top-act-btn {
      width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }

    /* Bottom Control Bar */
    .call-bottom-bar {
      position: relative; width: 100%; max-width: 320px; height: 80px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
      border-radius: 40px; display: flex; align-items: center; justify-content: space-around;
      padding: 0 12px; z-index: 40; border: 1px solid var(--glass-border);
    }
    .ctrl-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      background: rgba(255,255,255,0.15); color: #fff; transition: 0.2s;
    }
    .ctrl-btn:active { transform: scale(0.9); }
    .btn-end-call { background: #EF4444; width: 56px; height: 56px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
    .ctrl-btn.off { background: #F59E0B; }

    /* Group Grid Layout */
    .group-grid {
      position: absolute; inset: 0; display: grid; gap: 2px; z-index: 10;
      background: #000; transition: all 0.3s ease;
    }
    .grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-many { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .grid-tile { position: relative; width: 100%; height: 100%; background: #222; overflow: hidden; }
    .grid-tile video { width: 100%; height: 100%; object-fit: cover; }
    .tile-name {
      position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.5);
      color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 4px;
    }
    .active-speaker { border: 3px solid #25D366; box-sizing: border-box; }

    /* PiP Mode */
    .call-overlay.minimized {
      top: auto; left: auto; bottom: 80px; right: 14px; width: 160px; height: 220px;
      border-radius: 16px; border: 2px solid var(--pink); padding: 8px; overflow: hidden;
    }
    .call-overlay.minimized .call-top-bar, .call-overlay.minimized .call-bottom-bar, .call-overlay.minimized .call-user-info { display: none !important; }
    .call-overlay.minimized .remote-video-container { position: relative; }
    .btn-maximize {
      position: absolute; top: 8px; right: 8px; width: 30px; height: 30px;
      border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff;
      display: none; align-items: center; justify-content: center; z-index: 50; cursor: pointer;
    }
    .call-overlay.minimized .btn-maximize { display: flex; }

    /* Incoming Call Modal */
    .incoming-modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      z-index: 25000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .incoming-modal.show { display: flex; }
    .incoming-card {
      width: 100%; max-width: 320px; background: #161229; border: 1px solid var(--pink);
      border-radius: 28px; padding: 26px 20px; text-align: center; box-shadow: 0 0 40px var(--pink-glow);
    }
    .inc-avatar {
      width: 65px; height: 65px; border-radius: 22px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px;
    }
    .inc-actions { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
    .inc-btn {
      width: 54px; height: 54px; border-radius: 50%; border: none; font-size: 22px; color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .inc-accept { background: #10b981; }
    .inc-reject { background: #ef4444; }

    /* Modals */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 320px; background: #161328; border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .inp-cute {
      width: 100%; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      color: #fff; font-size: 13.5px; margin: 12px 0; outline: none;
    }
    .btn-cute {
      width: 100%; padding: 10px; border-radius: 10px; background: var(--cute-grad); color: #fff; font-weight: 700; border: none; cursor: pointer;
    }

    .toast-box { position: fixed; top: 12px; right: 12px; z-index: 99999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .toast {
      pointer-events: auto; padding: 9px 13px; background: rgba(25, 20, 42, 0.95);
      border: 1px solid var(--pink); border-radius: 10px; color: #fff; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="mesh-bg"></div>
  <div id="toastBox" class="toast-box"></div>

  <!-- 🔔 Incoming Call -->
  <div id="incomingModal" class="incoming-modal">
    <div class="incoming-card">
      <div class="inc-avatar">🌸</div>
      <h3 id="incCallerName" style="font-family:var(--font-head); font-size:16px;">ফ্রেন্ড</h3>
      <p id="incCallType" style="font-size:12px; color:var(--muted); margin-top:3px;">কল করছেন...</p>
      <div class="inc-actions">
        <button id="btnIncReject" class="inc-btn inc-reject">✕</button>
        <button id="btnIncAccept" class="inc-btn inc-accept">📞</button>
      </div>
    </div>
  </div>

  <!-- 🎥 ULTRA HD CALL OVERLAY -->
  <div id="callOverlay" class="call-overlay">
    <button id="btnMaximize" class="btn-maximize">⛶</button>

    <div class="call-top-bar">
      <div class="top-actions">
        <button id="btnSpeakerSwitch" class="top-act-btn" title="স্পিকার সুইচ">🔊</button>
      </div>
      <div class="call-user-info">
        <span id="activeCallTarget" class="call-user-name">ফ্রেন্ড</span>
        <span id="activeCallTimer" class="call-timer">00:00</span>
      </div>
      <div class="top-actions">
        <button id="btnCallMenu" class="top-act-btn" title="মেনু">⋮</button>
      </div>
    </div>

    <div class="remote-video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <!-- Group Grid (Hidden by default) -->
      <div id="groupGrid" class="group-grid" style="display:none;"></div>
    </div>

    <div id="selfView" class="self-view-container">
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-bottom-bar">
      <button id="btnToggleMic" class="ctrl-btn" title="মাইক">🎤</button>
      <button id="btnToggleCam" class="ctrl-btn" title="ক্যামেরা">📷</button>
      <button id="btnSwitchCam" class="ctrl-btn" title="ক্যামেরা সুইচ">🔄</button>
      <button id="btnHangup" class="ctrl-btn btn-end-call" title="কল শেষ">✕</button>
      <button id="btnScreenShare" class="ctrl-btn" title="স্ক্রিন শেয়ার">🖥️</button>
      <button id="btnMinimizeCall" class="ctrl-btn" title="মিনিমাইজ">🗗</button>
    </div>
  </div>

  <div id="app">
    <div class="chat-layout">
      <header class="chat-header">
        <button id="btnProfile" class="user-profile-btn">
          <div class="avatar" id="hdrAvatar">🌸<div class="online-dot"></div></div>
          <div class="user-text">
            <h2 id="hdrName">লোড হচ্ছে... ✏️</h2>
            <span>অনলাইন 💖 (গেস্ট মোড)</span>
          </div>
        </button>
        <div class="hdr-actions">
          <button id="btnStartAudioCall" class="icon-btn call-btn-audio">📞</button>
          <button id="btnStartVideoCall" class="icon-btn call-btn-video">🎥</button>
          <button id="btnOpenHelp" class="icon-btn btn-help">💡</button>
          <button id="btnSound" class="icon-btn">🔔</button>
        </div>
      </header>

      <div id="msgArea" class="msg-area"></div>

      <footer class="chat-footer">
        <div id="replyBar" class="reply-bar">
          <span id="repText">উত্তরে: ...</span>
          <button id="btnCancelRep" style="background:none; border:none; color: #fff; cursor:pointer;">✕</button>
        </div>
        <div class="input-row">
          <button id="btnAttach" class="icon-btn">📎</button>
          <button id="btnEmoji" class="icon-btn">😀</button>
          <div class="inp-box">
            <textarea id="chatInput" class="chat-txt" placeholder="মিষ্টি মেসেজ লিখুন..." rows="1"></textarea>
          </div>
          <button id="btnSend" class="send-btn" disabled>➤</button>
        </div>
        <input id="camInput" type="file" accept="image/*" capture="environment" style="display:none;" />
        <input id="galleryInput" type="file" accept="image/*" style="display:none;" />
        <div id="attachMenu" class="popover attach-menu">
          <button id="btnCam" class="att-item">📸 ক্যামেরা</button>
          <button id="btnGallery" class="att-item">🖼️ গ্যালারি</button>
        </div>
        <div id="emojiPop" class="popover emoji-pop">
          <div id="emojiGrid" class="emoji-grid"></div>
        </div>
      </footer>
    </div>
  </div>

  <div id="profileModal" class="modal">
    <div class="modal-card">
      <h3 style="text-align: center;">🌸 আপনার মিষ্টি নাম লিখুন</h3>
      <input id="inpNewName" class="inp-cute" placeholder="নাম লিখুন..." maxlength="20" />
      <button id="btnSaveName" class="btn-cute">সেভ করুন ✨</button>
    </div>
  </div>

  <div id="helpModal" class="modal">
    <div class="modal-card">
      <h3 style="color:#fbbf24; margin-bottom:10px;">💡 ইউজার হেল্প</h3>
      <ul style="font-size:12.5px; line-height:1.6; padding-left:18px;">
        <li><strong>ক্যামেরা সুইচ:</strong> 🔄 বাটনে ক্লিক করে ব্যাক ক্যামেরা ব্যবহার করুন।</li>
        <li><strong>সেলফ ভিউ:</strong> আপনার ভিডিও বক্সটি ড্র্যাগ করে সরাতে পারবেন।</li>
        <li><strong>PiP মোড:</strong> 🗗 বাটনে ক্লিক করে কল মিনিমাইজ করুন।</li>
      </ul>
      <button id="btnCloseHelp" class="btn-cute" style="margin-top:14px;">বুঝেছি ✨</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, doc, updateDoc, setDoc, deleteDoc,
      serverTimestamp, query, orderBy, limit, onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmLJ5Vdd6Pqm-FrPfANvjy1TZkhG1mxns",
      authDomain: "good-865a2.firebaseapp.com",
      projectId: "good-865a2",
      storageBucket: "good-865a2.firebasestorage.app",
      messagingSenderId: "367706014019",
      appId: "1:367706014019:web:f4e33a639f4573262baff6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const els = {
      hdrName: document.getElementById('hdrName'),
      btnProfile: document.getElementById('btnProfile'),
      profileModal: document.getElementById('profileModal'),
      inpNewName: document.getElementById('inpNewName'),
      btnSaveName: document.getElementById('btnSaveName'),
      btnOpenHelp: document.getElementById('btnOpenHelp'),
      helpModal: document.getElementById('helpModal'),
      btnCloseHelp: document.getElementById('btnCloseHelp'),
      msgArea: document.getElementById('msgArea'),
      btnSend: document.getElementById('btnSend'),
      chatInput: document.getElementById('chatInput'),
      toastBox: document.getElementById('toastBox'),
      btnStartAudioCall: document.getElementById('btnStartAudioCall'),
      btnStartVideoCall: document.getElementById('btnStartVideoCall'),
      callOverlay: document.getElementById('callOverlay'),
      activeCallTarget: document.getElementById('activeCallTarget'),
      activeCallTimer: document.getElementById('activeCallTimer'),
      localVideo: document.getElementById('localVideo'),
      remoteVideo: document.getElementById('remoteVideo'),
      btnToggleMic: document.getElementById('btnToggleMic'),
      btnToggleCam: document.getElementById('btnToggleCam'),
      btnSwitchCam: document.getElementById('btnSwitchCam'),
      btnHangup: document.getElementById('btnHangup'),
      btnScreenShare: document.getElementById('btnScreenShare'),
      btnMinimizeCall: document.getElementById('btnMinimizeCall'),
      btnMaximize: document.getElementById('btnMaximize'),
      selfView: document.getElementById('selfView'),
      groupGrid: document.getElementById('groupGrid'),
      incomingModal: document.getElementById('incomingModal'),
      incCallerName: document.getElementById('incCallerName'),
      btnIncAccept: document.getElementById('btnIncAccept'),
      btnIncReject: document.getElementById('btnIncReject')
    };

    let currentUser = null;
    let peerConnection = null;
    let localStream = null;
    let activeCallType = 'video';
    let callTimerInterval = null;
    let currentFacingMode = 'user';
    let isMuted = false;
    let isCamOff = false;

    const rtcConfig = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      els.toastBox.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; }, 3000);
      setTimeout(() => t.remove(), 3200);
    }

    // 🖱️ Draggable Self View Logic
    let isDragging = false;
    let offsetX, offsetY;

    els.selfView.onmousedown = els.selfView.ontouchstart = (e) => {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      offsetX = clientX - els.selfView.offsetLeft;
      offsetY = clientY - els.selfView.offsetTop;
    };

    window.onmousemove = window.ontouchmove = (e) => {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      els.selfView.style.left = (clientX - offsetX) + 'px';
      els.selfView.style.top = (clientY - offsetY) + 'px';
      els.selfView.style.right = 'auto';
    };

    window.onmouseup = window.ontouchend = () => { isDragging = false; };

    // 🔒 Auth & Init
    async function initAutoGuest() {
      let myName = localStorage.getItem('kawaii_user_name') || ('মিষ্টি ফ্রেন্ড ' + Math.floor(100 + Math.random() * 900));
      localStorage.setItem('kawaii_user_name', myName);
      els.hdrName.textContent = myName + " ✏️";
      try { await signInAnonymously(auth); } catch (err) {
        currentUser = { uid: 'guest_' + Date.now(), displayName: myName };
        startListeningMessages();
        listenIncomingCalls();
      }
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        currentUser.displayName = localStorage.getItem('kawaii_user_name') || 'মিষ্টি ফ্রেন্ড';
        startListeningMessages();
        listenIncomingCalls();
      }
    });

    els.btnProfile.onclick = () => { els.inpNewName.value = localStorage.getItem('kawaii_user_name') || ''; els.profileModal.classList.add('show'); };
    els.btnSaveName.onclick = () => {
      const n = els.inpNewName.value.trim();
      if (n) {
        localStorage.setItem('kawaii_user_name', n);
        if (currentUser) currentUser.displayName = n;
        els.hdrName.textContent = n + " ✏️";
        showToast('🌸 নাম আপডেট হয়েছে!');
      }
      els.profileModal.classList.remove('show');
    };

    els.btnOpenHelp.onclick = () => els.helpModal.classList.add('show');
    els.btnCloseHelp.onclick = () => els.helpModal.classList.remove('show');

    /* 💬 Messaging */
    function startListeningMessages() {
      const q = query(collection(db, 'messages'), orderBy('createdAt', 'asc'), limit(60));
      onSnapshot(q, snap => {
        snap.docChanges().forEach(change => {
          const m = { id: change.doc.id, ...change.doc.data() };
          if (change.type === 'added') appendBubble(m);
        });
        els.msgArea.scrollTop = els.msgArea.scrollHeight;
      });
    }

    function appendBubble(m) {
      if (document.getElementById(`msg-${m.id}`)) return;
      const isOwn = currentUser && m.senderId === currentUser.uid;
      const row = document.createElement('div');
      row.className = `msg-row ${isOwn ? 'own' : 'other'}`;
      row.id = `msg-${m.id}`;
      let content = m.type === 'image' ? `<img src="${m.mediaUrl}" class="msg-img" />` : `<div>${m.text || ''}</div>`;
      row.innerHTML = `<div class="b-wrap">${!isOwn ? `<div class="b-sender">${m.senderName || 'ফ্রেন্ড'}</div>` : ''}<div class="bubble">${content}<div class="b-meta"><span>✓✓</span></div></div></div>`;
      els.msgArea.appendChild(row);
    }

    async function sendMessage(text = '', type = 'text', mediaUrl = null) {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, 'messages'), {
          text, type, mediaUrl, senderId: currentUser.uid, senderName: currentUser.displayName || 'ফ্রেন্ড',
          createdAt: serverTimestamp()
        });
      } catch (e) { showToast('মেসেজ যায়নি'); }
    }

    els.btnSend.onclick = () => {
      const t = els.chatInput.value.trim();
      if (!t) return;
      sendMessage(t, 'text');
      els.chatInput.value = ''; els.btnSend.disabled = true;
    };
    els.chatInput.oninput = () => { els.btnSend.disabled = !els.chatInput.value.trim(); };

    /* 🎥 CALL ENGINE */
    els.btnStartAudioCall.onclick = () => startCall('audio');
    els.btnStartVideoCall.onclick = () => startCall('video');

    async function startCall(type) {
      activeCallType = type;
      showToast(type === 'video' ? '🎥 ভিডিও কল শুরু হচ্ছে...' : '📞 অডিও কল শুরু হচ্ছে...');
      const streamReady = await setupLocalMedia(type);
      if (!streamReady) return;
      setupCallUI(type, 'কল যাচ্ছে...', true);
      await clearOldCallData();
      peerConnection = new RTCPeerConnection(rtcConfig);
      registerPeerEvents();
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.onicecandidate = e => {
        if (e.candidate) addDoc(collection(db, 'calls', 'live_channel', 'callerCandidates'), e.candidate.toJSON());
      };
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      const callDoc = doc(db, 'calls', 'live_channel');
      await setDoc(callDoc, {
        callerId: currentUser.uid, callerName: currentUser.displayName || 'ফ্রেন্ড',
        type: type, status: 'calling', offer: { type: offer.type, sdp: offer.sdp }, createdAt: Date.now()
      });
      const unsubCall = onSnapshot(callDoc, async snap => {
        const data = snap.data();
        if (data && data.status === 'connected' && data.answer && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          startCallTimer();
        } else if (data && data.status === 'ended') {
          hangupCall(false);
          unsubCall();
        }
      });
      onSnapshot(collection(db, 'calls', 'live_channel', 'calleeCandidates'), snap => {
        snap.docChanges().forEach(change => {
          if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
      });
    }

    async function setupLocalMedia(type) {
      try {
        const constraints = {
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: type === 'video' ? { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } : false
        };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        els.localVideo.srcObject = localStream;
        els.localVideo.muted = true;
        await els.localVideo.play();
        return true;
      } catch (err) {
        alert('ক্যামেরা বা মাইক পারমিশন প্রয়োজন।');
        return false;
      }
    }

    async function switchCamera() {
      if (!localStream || activeCallType !== 'video') return;
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      showToast(`ক্যামেরা সুইচ: ${currentFacingMode === 'user' ? 'ফ্রন্ট' : 'ব্যাক'}`);
      localStream.getTracks().forEach(track => track.stop());
      const newStream = await setupLocalMedia(activeCallType);
      if (newStream) {
        const videoTrack = newStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender) sender.replaceTrack(videoTrack);
      }
    }

    els.btnSwitchCam.onclick = switchCamera;

    function registerPeerEvents() {
      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          els.remoteVideo.srcObject = event.streams[0];
          els.remoteVideo.play();
        }
      };
    }

    function setupCallUI(type, targetName, isCaller) {
      els.callOverlay.classList.remove('minimized');
      els.callOverlay.classList.add('show');
      els.activeCallTarget.textContent = targetName;
      els.activeCallTimer.textContent = isCaller ? 'কল যাচ্ছে... 🌸' : 'সংযুক্ত...';
      if (type === 'audio') {
        els.localVideo.style.display = 'none';
        els.remoteVideo.style.display = 'none';
        els.audioCallDisplay.style.display = 'flex';
      } else {
        els.localVideo.style.display = 'block';
        els.remoteVideo.style.display = 'block';
        els.audioCallDisplay.style.display = 'none';
      }
    }

    function startCallTimer() {
      callStartTime = Date.now();
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - callStartTime) / 1000);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        els.activeCallTimer.textContent = `কথা চলছে: ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }, 1000);
    }

    els.btnMinimizeCall.onclick = () => {
      els.callOverlay.classList.add('minimized');
      showToast('কলটি মিনিমাইজ হয়েছে।');
    };
    els.btnMaximize.onclick = () => {
      els.callOverlay.classList.remove('minimized');
    };

    els.btnHangup.onclick = () => hangupCall(true);

    async function hangupCall(notifyFirebase = true) {
      if (callTimerInterval) clearInterval(callTimerInterval);
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      els.localVideo.srcObject = null;
      els.remoteVideo.srcObject = null;
      els.callOverlay.classList.remove('show', 'minimized');
      showToast('কল সমাপ্ত হয়েছে');
      if (notifyFirebase) {
        try { await updateDoc(doc(db, 'calls', 'live_channel'), { status: 'ended' }); } catch (e) {}
      }
    }

    function listenIncomingCalls() {
      const callDoc = doc(db, 'calls', 'live_channel');
      onSnapshot(callDoc, snap => {
        const data = snap.data();
        if (data && data.status === 'calling' && data.callerId !== currentUser?.uid) {
          els.incomingModal.classList.add('show');
          els.incCallerName.textContent = data.callerName;
          els.btnIncAccept.onclick = () => acceptIncomingCall(data);
          els.btnIncReject.onclick = () => rejectIncomingCall();
        } else if (data && data.status === 'ended') {
          els.incomingModal.classList.remove('show');
        }
      });
    }

    async function acceptIncomingCall(callData) {
      els.incomingModal.classList.remove('show');
      activeCallType = callData.type;
      const streamReady = await setupLocalMedia(callData.type);
      if (!streamReady) return;
      setupCallUI(callData.type, callData.callerName, false);
      peerConnection = new RTCPeerConnection(rtcConfig);
      registerPeerEvents();
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.onicecandidate = e => {
        if (e.candidate) addDoc(collection(db, 'calls', 'live_channel', 'calleeCandidates'), e.candidate.toJSON());
      };
      await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await updateDoc(doc(db, 'calls', 'live_channel'), {
        answer: { type: answer.type, sdp: answer.sdp },
        status: 'connected'
      });
      onSnapshot(collection(db, 'calls', 'live_channel', 'callerCandidates'), snap => {
        snap.docChanges().forEach(change => {
          if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
      });
      startCallTimer();
    }

    async function rejectIncomingCall() {
      els.incomingModal.classList.remove('show');
      try { await updateDoc(doc(db, 'calls', 'live_channel'), { status: 'ended' }); } catch (e) {}
    }

    async function clearOldCallData() {
      try {
        const callerCands = await getDocs(collection(db, 'calls', 'live_channel', 'callerCandidates'));
        callerCands.forEach(d => deleteDoc(d.ref));
        const calleeCands = await getDocs(collection(db, 'calls', 'live_channel', 'calleeCandidates'));
        calleeCands.forEach(d => deleteDoc(d.ref));
      } catch (e) {}
    }

    els.btnToggleMic.onclick = () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      els.btnToggleMic.textContent = isMuted ? '🔇' : '🎤';
      els.btnToggleMic.classList.toggle('off', isMuted);
    };

    els.btnToggleCam.onclick = () => {
      if (!localStream || activeCallType === 'audio') return;
      isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      els.btnToggleCam.textContent = isCamOff ? '🚫' : '📷';
      els.btnToggleCam.classList.toggle('off', isCamOff);
    };

    els.btnScreenShare.onclick = async () => {
      if (!peerConnection || activeCallType === 'audio') return;
      try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const screenTrack = screenStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender) sender.replaceTrack(screenTrack);
        els.localVideo.srcObject = screenStream;
        showToast('🖥️ স্ক্রিন শেয়ার অন');
        screenTrack.onended = () => {
          const camTrack = localStream.getVideoTracks()[0];
          sender.replaceTrack(camTrack);
          els.localVideo.srcObject = localStream;
          showToast('স্ক্রিন শেয়ার বন্ধ');
        };
      } catch (err) { showToast('স্ক্রিন শেয়ার ব্যর্থ'); }
    };

    initAutoGuest();
  </script>
</body>
</html>
