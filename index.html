<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp Live</title>

  <!-- Firebase Compat Scripts (সব ব্রাউজারে ডাবল-ক্লিকেও চলে) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-panel: #111b21;
      --wa-header: #202c33;
      --wa-green: #00a884;
      --wa-green-bubble: #005c4b;
      --wa-gray-bubble: #202c33;
      --wa-text: #e9edef;
      --wa-muted: #8696a0;
      --wa-blue: #53bdeb;
      --wa-border: #222d34;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--wa-text); font-family: var(--font); font-size: 14px; }

    #app { width: 100%; height: 100dvh; display: flex; justify-content: center; background: #0c1317; }

    /* ডায়াগনস্টিক নোটিশ বার */
    .diag-banner {
      display: none; position: fixed; top: 0; left: 0; right: 0; background: #b91c1c; color: #fff;
      padding: 10px 14px; font-size: 13px; text-align: center; z-index: 99999; line-height: 1.4;
    }
    .diag-banner.show { display: block; }

    .wa-wrap {
      width: 100%; height: 100%; max-width: 900px; display: flex; flex-direction: column;
      background: var(--wa-bg); position: relative; border-left: 1px solid var(--wa-border); border-right: 1px solid var(--wa-border);
    }

    /* HEADER */
    .chat-header {
      height: 60px; padding: 10px 14px; background: var(--wa-header);
      display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    .header-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar {
      position: relative; width: 40px; height: 40px; border-radius: 50%; background: #6a7175;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff;
    }
    .online-badge {
      position: absolute; bottom: 0; right: 0; width: 11px; height: 11px;
      background: var(--wa-green); border-radius: 50%; border: 2px solid var(--wa-header);
    }
    .user-info h2 { font-size: 14.5px; font-weight: 600; color: #fff; }
    .user-info span { font-size: 11.5px; color: var(--wa-green); }

    .header-tools { display: flex; align-items: center; gap: 6px; }
    .tool-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
      color: var(--wa-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* MESSAGES AREA */
    .chat-area {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px;
      background-color: #0b141a;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

    .date-badge {
      align-self: center; margin: 8px 0; background: var(--wa-header);
      padding: 4px 12px; border-radius: 6px; font-size: 11px; color: var(--wa-muted);
    }

    /* BUBBLES */
    .msg-row { display: flex; margin-bottom: 2px; }
    .msg-row.own { justify-content: flex-end; }
    .msg-row.other { justify-content: flex-start; }

    .msg-bubble {
      position: relative; max-width: 78%; padding: 6px 9px 6px; border-radius: 7.5px;
      font-size: 14px; line-height: 1.4; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.3);
    }
    .msg-row.own .msg-bubble { background: var(--wa-green-bubble); color: #fff; border-top-right-radius: 0; }
    .msg-row.other .msg-bubble { background: var(--wa-gray-bubble); color: var(--wa-text); border-top-left-radius: 0; }

    .msg-row.own .msg-bubble::after {
      content: ''; position: absolute; top: 0; right: -6px; width: 0; height: 0;
      border: 6px solid transparent; border-top-color: var(--wa-green-bubble); border-right: 0;
    }
    .msg-row.other .msg-bubble::after {
      content: ''; position: absolute; top: 0; left: -6px; width: 0; height: 0;
      border: 6px solid transparent; border-top-color: var(--wa-gray-bubble); border-left: 0;
    }

    .msg-sender { font-size: 11px; font-weight: 700; color: #53bdeb; margin-bottom: 2px; }
    .msg-img { max-width: 240px; max-height: 260px; border-radius: 6px; display: block; margin-bottom: 4px; cursor: pointer; }
    
    .v-player { display: flex; align-items: center; gap: 8px; min-width: 180px; padding: 2px 0; }
    .v-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: #fff;
      color: #005c4b; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .meta-box {
      float: right; margin-left: 8px; margin-top: 4px; display: flex; align-items: center; gap: 3px;
      font-size: 10px; color: rgba(255,255,255,0.6);
    }
    .blue-tick { color: var(--wa-blue); font-weight: 700; letter-spacing: -2px; }

    /* FOOTER */
    .chat-footer {
      min-height: 60px; padding: 6px 10px; background: var(--wa-header);
      display: flex; align-items: center; gap: 6px; position: relative; z-index: 10;
    }
    .input-box {
      flex: 1; background: #2a3942; border-radius: 8px; display: flex; align-items: center;
      padding: 8px 12px; min-height: 40px;
    }
    .chat-input {
      width: 100%; max-height: 90px; min-height: 22px; height: 22px; background: transparent;
      border: none; color: #fff; font-size: 14px; font-family: var(--font); resize: none; outline: none;
    }
    .btn-send {
      width: 40px; height: 40px; border-radius: 50%; background: var(--wa-green);
      border: none; color: #111b21; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 17px;
    }

    /* POPOVERS */
    .popover {
      position: absolute; bottom: 64px; background: #233138; border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; z-index: 40; border: 1px solid var(--wa-border);
    }
    .popover.show { display: block; }
    .attach-menu { left: 10px; padding: 6px; width: 170px; }
    .att-btn {
      width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      background: none; border: none; color: var(--wa-text); font-size: 13px; border-radius: 6px; cursor: pointer; text-align: left;
    }
    .att-btn:hover { background: rgba(255,255,255,0.08); }

    .emoji-pop { left: 10px; width: 280px; max-height: 220px; overflow-y: auto; padding: 8px; }
    .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .e-btn { background: none; border: none; font-size: 20px; padding: 4px; cursor: pointer; border-radius: 4px; }

    /* CALL WINDOW */
    .call-screen {
      position: fixed; inset: 0; background: #0c1317; z-index: 20000;
      display: none; flex-direction: column; justify-content: space-between; padding: 20px 16px 30px;
    }
    .call-screen.show { display: flex; }
    .call-stage {
      position: relative; width: 100%; max-width: 440px; flex: 1; border-radius: 14px;
      overflow: hidden; background: #111b21; margin: 12px auto; display: flex; align-items: center; justify-content: center;
    }
    video#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    video#localVideo {
      position: absolute; bottom: 10px; right: 10px; width: 100px; height: 130px;
      border-radius: 10px; object-fit: cover; border: 2px solid var(--wa-green);
    }
    .call-ctrls { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .c-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; background: #2a3942;
    }
    .c-btn.end { background: #ea0038; }

    /* MODAL */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 30000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-card { width: 100%; max-width: 300px; background: #202c33; border-radius: 14px; padding: 18px; text-align: center; }
    .wa-inp {
      width: 100%; padding: 10px; background: #111b21; border: 1px solid var(--wa-border);
      border-radius: 6px; color: #fff; margin: 10px 0; outline: none; font-size: 14px;
    }
    .wa-btn {
      width: 100%; padding: 10px; background: var(--wa-green); color: #111b21;
      font-weight: 700; border: none; border-radius: 6px; cursor: pointer;
    }

    .toast-box { position: fixed; top: 14px; right: 14px; z-index: 99999; display: flex; flex-direction: column; gap: 6px; }
    .toast { padding: 9px 14px; background: #202c33; border-left: 4px solid var(--wa-green); color: #fff; border-radius: 4px; font-size: 12.5px; }
  </style>
</head>
<body>
  <div id="diagBanner" class="diag-banner"></div>
  <div id="toastBox" class="toast-box"></div>

  <!-- লাইভ কল স্ক্রিন -->
  <div id="callScreen" class="call-screen">
    <div style="text-align:center;">
      <h3 id="callPeerName" style="color:#fff;">লাইভ কল</h3>
      <div id="callTimer" style="font-size:12px; color:var(--wa-green); margin-top:2px;">00:00</div>
    </div>
    <div class="call-stage">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-ctrls">
      <button id="btnMute" class="c-btn">🎤</button>
      <button id="btnEnd" class="c-btn end">✕</button>
    </div>
  </div>

  <div id="app">
    <div class="wa-wrap">
      <!-- HEADER -->
      <header class="chat-header">
        <div class="header-user" id="btnProfile">
          <div class="avatar" id="myAvatar">👤<div class="online-badge"></div></div>
          <div class="user-info">
            <h2 id="myName">আমার নাম ✏️</h2>
            <span id="connStatus">কানেক্ট হচ্ছে...</span>
          </div>
        </div>
        <div class="header-tools">
          <button id="btnAudioCall" class="tool-btn" title="অডিও কল">📞</button>
          <button id="btnVideoCall" class="tool-btn" title="ভিডিও কল">🎥</button>
        </div>
      </header>

      <!-- MESSAGES VIEWPORT -->
      <div class="chat-area" id="chatArea">
        <div class="date-badge">🔒 এন্ড-টু-এন্ড এনক্রিপ্টেড মেসেজ</div>
      </div>

      <!-- FOOTER INPUT -->
      <footer class="chat-footer">
        <button id="btnEmoji" class="tool-btn" type="button">😀</button>
        <button id="btnAttach" class="tool-btn" type="button">📎</button>

        <div class="input-box">
          <textarea id="chatInput" class="chat-input" placeholder="একটি বার্তা লিখুন..." rows="1"></textarea>
        </div>

        <button id="btnMic" class="tool-btn" type="button" title="ভয়েস রেকর্ড">🎤</button>
        <button id="btnSend" class="btn-send" type="button">➤</button>

        <!-- Hidden Inputs -->
        <input id="camInput" type="file" accept="image/*" capture="environment" style="display:none;" />
        <input id="galleryInput" type="file" accept="image/*" style="display:none;" />

        <!-- Popovers -->
        <div id="attachMenu" class="popover attach-menu">
          <button id="actCam" class="att-btn">📸 মোবাইল ক্যামেরা</button>
          <button id="actGallery" class="att-btn">🖼️ গ্যালারি ছবি</button>
        </div>

        <div id="emojiPop" class="popover emoji-pop">
          <div id="emojiGrid" class="emoji-grid"></div>
        </div>
      </footer>
    </div>
  </div>

  <!-- প্রোফাইল মোডাল -->
  <div id="profileModal" class="modal">
    <div class="modal-card">
      <h3 style="color:#fff;">আপনার নাম লিখুন</h3>
      <input id="inpNewName" class="wa-inp" placeholder="যেমন: বন্ধু / সাথী" maxlength="15" />
      <button id="btnSaveName" class="wa-btn">সেভ করুন</button>
    </div>
  </div>

  <!-- ════════════ ১০০০% নির্ভরযোগ্য জাভাস্ক্রিপ্ট ════════════ -->
  <script>
    // 🎯 আপনার ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyAmLJ5Vdd6Pqm-FrPfANvjy1TZkhG1mxns",
      authDomain: "good-865a2.firebaseapp.com",
      projectId: "good-865a2",
      storageBucket: "good-865a2.firebasestorage.app",
      messagingSenderId: "367706014019",
      appId: "1:367706014019:web:f4e33a639f4573262baff6"
    };

    // ফায়ারবেস ইনিট
    let auth, db, isFirebaseLive = false;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase Init Error:", e);
    }

    const els = {
      myAvatar: document.getElementById('myAvatar'),
      myName: document.getElementById('myName'),
      connStatus: document.getElementById('connStatus'),
      diagBanner: document.getElementById('diagBanner'),
      btnProfile: document.getElementById('btnProfile'),
      profileModal: document.getElementById('profileModal'),
      inpNewName: document.getElementById('inpNewName'),
      btnSaveName: document.getElementById('btnSaveName'),
      chatArea: document.getElementById('chatArea'),
      chatInput: document.getElementById('chatInput'),
      btnSend: document.getElementById('btnSend'),
      btnAttach: document.getElementById('btnAttach'),
      attachMenu: document.getElementById('attachMenu'),
      actCam: document.getElementById('actCam'),
      actGallery: document.getElementById('actGallery'),
      camInput: document.getElementById('camInput'),
      galleryInput: document.getElementById('galleryInput'),
      btnEmoji: document.getElementById('btnEmoji'),
      emojiPop: document.getElementById('emojiPop'),
      emojiGrid: document.getElementById('emojiGrid'),
      btnMic: document.getElementById('btnMic'),
      toastBox: document.getElementById('toastBox'),

      // Call elements
      btnAudioCall: document.getElementById('btnAudioCall'),
      btnVideoCall: document.getElementById('btnVideoCall'),
      callScreen: document.getElementById('callScreen'),
      callPeerName: document.getElementById('callPeerName'),
      callTimer: document.getElementById('callTimer'),
      localVideo: document.getElementById('localVideo'),
      remoteVideo: document.getElementById('remoteVideo'),
      btnMute: document.getElementById('btnMute'),
      btnEnd: document.getElementById('btnEnd')
    };

    let currentUser = null;
    let isRecordingVoice = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let peerConn = null;
    let localStream = null;
    let callTimerInterval = null;
    let isMuted = false;

    const rtcConfig = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
    const EMOJIS = ["😀","😂","🥰","😍","😎","👍","🙏","❤️","🔥","🎉","✨","🌸","👏","💯","🥺","🥳","🙌","🌹","🤝","⭐","☕","🍔","🍕","⚽"];

    function showToast(msg) {
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
      els.toastBox.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 3000);
    }

    // 🔒 গ্যারান্টিযুক্ত লোকাল ইউজার (কখনো নাল হবে না)
    function getSafeUser() {
      if (currentUser && currentUser.uid) return currentUser;
      const uid = localStorage.getItem('wa_uid_v4') || ('u_' + Math.floor(1000 + Math.random() * 9000));
      const name = localStorage.getItem('wa_name_v4') || ('ফ্রেন্ড_' + Math.floor(100 + Math.random() * 900));
      localStorage.setItem('wa_uid_v4', uid);
      localStorage.setItem('wa_name_v4', name);
      currentUser = { uid: uid, displayName: name };
      return currentUser;
    }

    // অ্যাপ স্টার্ট
    function startApp() {
      const user = getSafeUser();
      els.myName.textContent = user.displayName + ' ✏️';
      els.myAvatar.textContent = user.displayName.charAt(0).toUpperCase();

      // নাম পরিবর্তনের অপশন
      els.btnProfile.onclick = () => {
        els.inpNewName.value = getSafeUser().displayName;
        els.profileModal.classList.add('show');
      };
      els.btnSaveName.onclick = () => {
        const n = els.inpNewName.value.trim();
        if (n) {
          localStorage.setItem('wa_name_v4', n);
          getSafeUser().displayName = n;
          els.myName.textContent = n + ' ✏️';
          els.myAvatar.textContent = n.charAt(0).toUpperCase();
          showToast('নাম পরিবর্তন হয়েছে');
        }
        els.profileModal.classList.remove('show');
      };

      // ফায়ারবেস অথ ও ডাটাবেস লিসেন
      if (auth && db) {
        auth.signInAnonymously().catch(e => console.log("Auth bypass:", e));
        auth.onAuthStateChanged(u => {
          if (u) {
            currentUser = u;
            currentUser.displayName = localStorage.getItem('wa_name_v4') || 'ফ্রেন্ড';
          }
        });
        listenMessages();
      } else {
        els.connStatus.textContent = 'লোকাল মোড 🟡';
      }
    }

    /* ════════════ মেসেজ রিয়েলটাইম লিসেনার ════════════ */
    function listenMessages() {
      db.collection("messages").orderBy("createdAt", "asc").limit(80).onSnapshot(snap => {
        isFirebaseLive = true;
        els.connStatus.textContent = 'অনলাইন 🟢';
        els.diagBanner.classList.remove('show');

        snap.docChanges().forEach(change => {
          if (change.type === "added") {
            const m = { id: change.doc.id, ...change.doc.data() };
            appendBubble(m);
          }
        });
        els.chatArea.scrollTop = els.chatArea.scrollHeight;
      }, err => {
        console.error("Firestore Listen Error:", err);
        els.connStatus.textContent = 'রুলস এরর 🔴';
        els.diagBanner.innerHTML = '⚠️ <strong>Firestore Database Rules সমস্যা:</strong><br>Firebase Console > Firestore Database > Rules-এ গিয়ে <code>allow read, write: if true;</code> দিয়ে <strong>Publish</strong> করুন।';
        els.diagBanner.classList.add('show');
      });
    }

    function appendBubble(m) {
      if (document.getElementById('msg-' + m.id)) return;
      const isOwn = getSafeUser().uid === m.senderId;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isOwn ? 'own' : 'other');
      row.id = 'msg-' + m.id;

      let mediaHtml = '';
      if (m.type === 'image') {
        mediaHtml = '<img src="' + m.mediaUrl + '" class="msg-img" onclick="window.open(this.src)" />';
      } else if (m.type === 'voice') {
        mediaHtml = '<div class="v-player"><button class="v-btn" onclick="playAudio(this, \'' + m.mediaUrl + '\')">▶</button><span>ভয়েস মেসেজ</span></div>';
      }

      const textHtml = m.text ? '<div>' + escapeHtml(m.text) + '</div>' : '';
      const tick = isOwn ? '<span class="blue-tick">✓✓</span>' : '';

      row.innerHTML = `
        <div class="msg-bubble">
          ${!isOwn ? '<div class="msg-sender">' + escapeHtml(m.senderName || 'ফ্রেন্ড') + '</div>' : ''}
          ${mediaHtml}
          ${textHtml}
          <div class="meta-box"><span>এখন</span>${tick}</div>
        </div>
      `;
      els.chatArea.appendChild(row);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.playAudio = function(btn, url) {
      const a = new Audio(url);
      btn.textContent = '⏸';
      a.play();
      a.onended = () => btn.textContent = '▶';
    };

    /* ════════════ সেন্ড মেসেজ অ্যাকশন ════════════ */
    function sendMsg(text, type, mediaUrl) {
      text = text || '';
      type = type || 'text';
      mediaUrl = mediaUrl || null;

      const user = getSafeUser();
      const payload = {
        text: text,
        type: type,
        mediaUrl: mediaUrl,
        senderId: user.uid,
        senderName: user.displayName || 'ফ্রেন্ড',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (db) {
        db.collection("messages").add(payload).catch(err => {
          console.error("Add message error:", err);
          showToast('মেসেজ যায়নি! Rules পাবলিশ করুন');
        });
      }
    }

    // সেন্ড বাটন ক্লিক
    els.btnSend.onclick = () => {
      const t = els.chatInput.value.trim();
      if (!t) return;
      sendMsg(t, 'text');
      els.chatInput.value = '';
      els.chatInput.style.height = '22px';
    };

    // এন্টার চাপলে সেন্ড
    els.chatInput.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        els.btnSend.click();
      }
    };

    /* ════════════ ক্যামেরা ও ছবি কম্প্রেশন ════════════ */
    els.btnAttach.onclick = e => {
      e.stopPropagation();
      els.attachMenu.classList.toggle('show');
    };
    els.actCam.onclick = () => {
      els.attachMenu.classList.remove('show');
      els.camInput.click();
    };
    els.actGallery.onclick = () => {
      els.attachMenu.classList.remove('show');
      els.galleryInput.click();
    };

    els.camInput.onchange = els.galleryInput.onchange = e => {
      const f = e.target.files[0];
      if (f) {
        showToast('ছবি প্রস্তুত হচ্ছে...');
        compressPhoto(f, b64 => {
          sendMsg('', 'image', b64);
        });
      }
      e.target.value = '';
    };

    function compressPhoto(file, cb) {
      const r = new FileReader();
      r.readAsDataURL(file);
      r.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement('canvas');
          let w = img.width, h = img.height, max = 450;
          if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
          else if (h > max) { w = Math.round((w * max) / h); h = max; }
          cvs.width = w; cvs.height = h;
          cvs.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(cvs.toDataURL('image/jpeg', 0.5));
        };
        img.src = ev.target.result;
      };
    }

    /* ════════════ ভয়েস রেকর্ডার ════════════ */
    els.btnMic.onclick = () => {
      if (!isRecordingVoice) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return showToast('ব্রাউজারে মাইক সাপোর্ট নেই');
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => sendMsg('', 'voice', reader.result);
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          isRecordingVoice = true;
          els.btnMic.style.color = '#ef4444';
          showToast('🎤 কথা বলুন, শেষ হলে আবার চাপুন');
        }).catch(() => showToast('মাইক্রোফোন অনুমতি দিন'));
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isRecordingVoice = false;
        els.btnMic.style.color = 'var(--wa-muted)';
      }
    };

    /* ════════════ অডিও ও ভিডিও কল ════════════ */
    els.btnAudioCall.onclick = () => startCall('audio');
    els.btnVideoCall.onclick = () => startCall('video');

    function startCall(type) {
      els.callScreen.classList.add('show');
      els.remoteVideo.style.display = type === 'video' ? 'block' : 'none';
      els.localVideo.style.display = type === 'video' ? 'block' : 'none';

      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true },
        video: type === 'video' ? { facingMode: 'user', width: 480 } : false
      }).then(s => {
        localStream = s;
        els.localVideo.srcObject = localStream;
        els.localVideo.muted = true; // জিরো ইকো

        peerConn = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));

        peerConn.ontrack = ev => {
          if (ev.streams && ev.streams[0]) els.remoteVideo.srcObject = ev.streams[0];
        };

        const sTime = Date.now();
        callTimerInterval = setInterval(() => {
          const sec = Math.floor((Date.now() - sTime) / 1000);
          els.callTimer.textContent = `${Math.floor(sec/60)}:${sec%60 < 10 ? '0' : ''}${sec%60}`;
        }, 1000);
      }).catch(() => {
        showToast('ক্যামেরা/মাইক অনুমতি দিন');
        els.callScreen.classList.remove('show');
      });
    }

    els.btnEnd.onclick = () => {
      if (callTimerInterval) clearInterval(callTimerInterval);
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConn) peerConn.close();
      els.callScreen.classList.remove('show');
    };

    els.btnMute.onclick = () => {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        els.btnMute.textContent = isMuted ? '🔇' : '🎤';
      }
    };

    /* ════════════ ইমোজি ════════════ */
    els.btnEmoji.onclick = e => {
      e.stopPropagation();
      els.emojiPop.classList.toggle('show');
    };
    els.emojiGrid.innerHTML = EMOJIS.map(em => `<button class="e-btn" type="button">${em}</button>`).join('');
    els.emojiGrid.onclick = e => {
      if (e.target.classList.contains('e-btn')) {
        els.chatInput.value += e.target.textContent;
      }
    };

    // বাইরে চাপ দিলে পপআপ বন্ধ
    document.onclick = () => {
      els.attachMenu.classList.remove('show');
      els.emojiPop.classList.remove('show');
    };

    // স্টার্ট
    startApp();
  </script>
</body>
</html>
