<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp Ultra Pro — ১০০টি কার্যকর ফিচার</title>

  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-panel: #111b21;
      --wa-header: #202c33;
      --wa-green: #00a884;
      --wa-green-bubble: #005c4b;
      --wa-gray-bubble: #202c33;
      --wa-text: #e9edef;
      --wa-muted: #8696a0;
      --wa-blue: #53bdeb;
      --wa-border: #222d34;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body.theme-pink {
      --wa-bg: #140a14; --wa-panel: #1d0f1e; --wa-header: #2c162b; --wa-green: #f472b6;
      --wa-green-bubble: #9d174d; --wa-gray-bubble: #2c162b; --wa-blue: #f472b6;
    }
    body.theme-light {
      --wa-bg: #efeae2; --wa-panel: #ffffff; --wa-header: #f0f2f5; --wa-green: #00a884;
      --wa-green-bubble: #d9fdd3; --wa-gray-bubble: #ffffff; --wa-text: #111b21; --wa-muted: #667781;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1317; color: var(--wa-text); font-family: var(--font); font-size: 14px; }

    #app { width: 100%; height: 100dvh; display: flex; justify-content: center; }
    .wa-wrap { width: 100%; height: 100%; max-width: 1400px; display: flex; background: var(--wa-panel); position: relative; }

    /* পিন লক স্ক্রিন */
    .pin-overlay {
      position: fixed; inset: 0; background: var(--wa-bg); z-index: 50000;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .pin-overlay.show { display: flex; }
    .pin-dots { display: flex; gap: 10px; margin: 8px 0; }
    .p-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--wa-green); }
    .p-dot.filled { background: var(--wa-green); box-shadow: 0 0 10px var(--wa-green); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 65px); gap: 12px; }
    .p-btn {
      width: 65px; height: 65px; border-radius: 50%; background: var(--wa-header); border: 1px solid var(--wa-border);
      color: #fff; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* সাইডবার */
    .sidebar {
      width: 100%; max-width: 380px; height: 100%; display: flex; flex-direction: column;
      background: var(--wa-panel); border-right: 1px solid var(--wa-border); z-index: 10;
    }
    .sidebar-header {
      height: 60px; padding: 10px 14px; background: var(--wa-header);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .my-profile-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; color: inherit; text-align: left; }
    .avatar {
      position: relative; width: 40px; height: 40px; border-radius: 50%; background: #6a7175;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .online-badge { position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; background: var(--wa-green); border-radius: 50%; border: 2px solid var(--wa-header); }

    .header-icons { display: flex; align-items: center; gap: 4px; }
    .tool-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
      color: var(--wa-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* স্টোরিজ বার */
    .stories-bar {
      display: flex; gap: 12px; padding: 10px 14px; overflow-x: auto; background: var(--wa-panel);
      border-bottom: 1px solid var(--wa-border); scrollbar-width: none;
    }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex-shrink: 0; }
    .story-ring {
      width: 44px; height: 44px; border-radius: 50%; padding: 2px;
      background: linear-gradient(135deg, #00a884, #34b7f1); display: flex; align-items: center; justify-content: center;
    }
    .story-avatar-box { width: 100%; height: 100%; border-radius: 50%; background: #111b21; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }

    /* চ্যাট লিস্ট */
    .search-wrap { padding: 8px 12px; background: var(--wa-panel); border-bottom: 1px solid var(--wa-border); }
    .search-box {
      background: var(--wa-header); border-radius: 8px; display: flex; align-items: center; padding: 0 10px; gap: 8px; height: 36px;
    }
    .search-box input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 13.5px; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-contact {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .chat-contact:hover, .chat-contact.active { background: #202c33; }
    .contact-info { flex: 1; overflow: hidden; }
    .contact-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .contact-name { font-weight: 600; font-size: 14px; }
    .contact-preview { font-size: 12.5px; color: var(--wa-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* কনভারসেশন প্যানেল */
    .conversation-panel {
      flex: 1; height: 100%; display: flex; flex-direction: column; background: var(--wa-bg); position: relative;
    }
    @media (max-width: 768px) {
      .sidebar { max-width: 100%; }
      .conversation-panel { position: absolute; inset: 0; z-index: 20; transform: translateX(100%); transition: transform 0.25s ease; }
      .conversation-panel.active { transform: translateX(0); }
    }

    .chat-top-bar {
      height: 60px; padding: 10px 16px; background: var(--wa-header);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10;
    }
    .chat-user-view { display: flex; align-items: center; gap: 10px; }
    .btn-chat-back { display: none; background: none; border: none; color: var(--wa-text); font-size: 20px; cursor: pointer; }
    @media (max-width: 768px) { .btn-chat-back { display: block; } }

    .pinned-banner {
      display: none; align-items: center; justify-content: space-between; padding: 6px 14px;
      background: rgba(0, 168, 132, 0.15); border-bottom: 1px solid var(--wa-green); font-size: 12px;
    }
    .pinned-banner.show { display: flex; }

    /* মেসেজ হিস্ট্রি */
    .chat-viewport {
      flex: 1; overflow-y: auto; padding: 14px 4%; display: flex; flex-direction: column; gap: 4px;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 20px 20px;
    }

    .msg-row { display: flex; margin-bottom: 2px; }
    .msg-row.own { justify-content: flex-end; }
    .msg-row.other { justify-content: flex-start; }

    .msg-box {
      position: relative; max-width: 75%; padding: 6px 9px 7px; border-radius: 8px;
      font-size: 14px; line-height: 1.45; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .msg-row.own .msg-box { background: var(--wa-green-bubble); color: #fff; border-top-right-radius: 0; }
    .msg-row.other .msg-box { background: var(--wa-gray-bubble); color: var(--wa-text); border-top-left-radius: 0; }

    .msg-box::before { content: ''; position: absolute; top: 0; width: 0; height: 0; border: 7px solid transparent; }
    .msg-row.own .msg-box::before { right: -7px; border-top-color: var(--wa-green-bubble); border-right: 0; }
    .msg-row.other .msg-box::before { left: -7px; border-top-color: var(--wa-gray-bubble); border-left: 0; }

    .msg-img { max-width: 250px; max-height: 270px; border-radius: 6px; cursor: zoom-in; display: block; margin-bottom: 4px; }
    .v-player-wa { display: flex; align-items: center; gap: 8px; min-width: 190px; padding: 2px 0; }
    .v-play-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: #fff;
      color: #005c4b; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }

    .b-actions {
      position: absolute; top: -14px; display: none; align-items: center;
      background: #111b21; border: 1px solid var(--wa-border); border-radius: 8px; padding: 1px 4px; z-index: 5; gap: 2px;
    }
    .msg-row.own .b-actions { right: 6px; }
    .msg-row.other .b-actions { left: 6px; }
    .msg-box:hover .b-actions { display: flex; }
    .b-act-btn { background: none; border: none; color: var(--wa-muted); padding: 2px 4px; cursor: pointer; font-size: 11px; }

    .meta-tag {
      float: right; margin-left: 8px; margin-top: 4px; display: flex; align-items: center; gap: 4px;
      font-size: 10px; color: rgba(255,255,255,0.6);
    }
    .tick-blue { color: var(--wa-blue); font-weight: 700; letter-spacing: -2px; }

    /* ইনপুট ফুটার */
    .chat-footer {
      min-height: 62px; padding: 8px 12px; background: var(--wa-header);
      display: flex; align-items: center; gap: 6px; position: relative; z-index: 10;
    }
    .reply-preview-bar {
      display: none; justify-content: space-between; align-items: center;
      padding: 4px 8px; font-size: 11.5px; color: var(--wa-green); border-left: 3px solid var(--wa-green); margin-bottom: 4px;
    }
    .reply-preview-bar.show { display: flex; }

    .footer-pill {
      flex: 1; background: #2a3942; border-radius: 8px; display: flex; align-items: center;
      padding: 8px 12px; min-height: 42px; gap: 6px;
    }
    .chat-input {
      width: 100%; max-height: 90px; min-height: 22px; height: 22px; background: transparent;
      border: none; color: #fff; font-size: 14.5px; font-family: var(--font); resize: none; outline: none;
    }
    .btn-send-wa {
      width: 40px; height: 40px; border-radius: 50%; background: var(--wa-green);
      border: none; color: #111b21; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
    }

    /* Popovers */
    .popover-menu {
      position: absolute; bottom: 68px; background: #233138; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); display: none; z-index: 40; border: 1px solid var(--wa-border);
    }
    .popover-menu.show { display: block; }
    .att-menu { left: 12px; padding: 6px; width: 180px; }
    .att-btn {
      width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      background: none; border: none; color: var(--wa-text); font-size: 13px; border-radius: 6px; cursor: pointer; text-align: left;
    }
    .att-btn:hover { background: rgba(255,255,255,0.08); }

    .emoji-pop { left: 12px; width: 300px; max-height: 240px; overflow-y: auto; padding: 8px; }
    .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .em-btn { background: none; border: none; font-size: 20px; padding: 4px; cursor: pointer; border-radius: 4px; }

    /* কল স্ক্রিন */
    .call-screen {
      position: fixed; inset: 0; background: #0c1317; z-index: 30000;
      display: none; flex-direction: column; justify-content: space-between; padding: 16px 14px 30px;
    }
    .call-screen.show { display: flex; }
    .call-screen.minimized {
      top: auto; left: auto; bottom: 70px; right: 14px; width: 150px; height: 210px;
      border-radius: 14px; border: 2px solid var(--wa-green); padding: 4px;
    }
    .video-box {
      position: relative; width: 100%; max-width: 480px; flex: 1; border-radius: 14px;
      overflow: hidden; background: #111b21; margin: 10px auto; display: flex; align-items: center; justify-content: center;
    }
    video#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    video#localVideo {
      position: absolute; bottom: 12px; right: 12px; width: 100px; height: 135px;
      border-radius: 10px; object-fit: cover; border: 2px solid var(--wa-green);
    }
    .call-ctrl-bar { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .call-btn-act {
      width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; background: #2a3942;
    }
    .call-btn-act.end { background: #ea0038; }

    /* Modals */
    .wa-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 35000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .wa-modal.show { display: flex; }
    .wa-modal-box { width: 100%; max-width: 320px; background: #202c33; border-radius: 14px; padding: 18px; }
    .wa-inp-clean { width: 100%; padding: 10px; background: #111b21; border: 1px solid var(--wa-border); border-radius: 8px; color: #fff; margin: 10px 0; outline: none; }
    .wa-btn-solid { width: 100%; padding: 10px; background: var(--wa-green); color: #111b21; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }

    canvas#doodleCanvas { background: #111b21; border-radius: 10px; touch-action: none; cursor: crosshair; }
    .toast-box { position: fixed; top: 14px; right: 14px; z-index: 99999; display: flex; flex-direction: column; gap: 6px; }
    .toast { padding: 9px 14px; background: #202c33; border-left: 4px solid var(--wa-green); color: #fff; border-radius: 6px; font-size: 12.5px; }
  </style>
</head>
<body>
  <div id="toastBox" class="toast-box"></div>

  <!-- পিন লক স্ক্রিন -->
  <div id="pinLockScreen" class="pin-overlay">
    <div class="avatar" style="width:50px; height:50px; background:var(--wa-green); font-size:20px;">🔒</div>
    <h3 style="color:#fff;">WhatsApp Protected</h3>
    <div class="pin-dots">
      <div class="p-dot"></div><div class="p-dot"></div><div class="p-dot"></div><div class="p-dot"></div>
    </div>
    <div class="pin-pad">
      <button class="p-btn">1</button><button class="p-btn">2</button><button class="p-btn">3</button>
      <button class="p-btn">4</button><button class="p-btn">5</button><button class="p-btn">6</button>
      <button class="p-btn">7</button><button class="p-btn">8</button><button class="p-btn">9</button>
      <button class="p-btn" style="font-size:14px;">✕</button><button class="p-btn">0</button><button class="p-btn" style="font-size:14px;">🔓</button>
    </div>
  </div>

  <!-- কল স্ক্রিন -->
  <div id="callScreen" class="call-screen">
    <div style="text-align:center;">
      <h3 id="callPeerTitle" style="color:#fff;">ফ্রেন্ড</h3>
      <div id="callDurationTimer" style="font-size:12px; color:var(--wa-green); margin-top:2px;">00:00</div>
    </div>
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-ctrl-bar">
      <button id="btnMuteMic" class="call-btn-act" title="মাইক অন/অফ">🎤</button>
      <button id="btnEndCall" class="call-btn-act end" title="কল শেষ">✕</button>
      <button id="btnMinimizeCall" class="call-btn-act" title="মিনিমাইজ">🗗</button>
    </div>
  </div>

  <div id="app">
    <div class="wa-wrap">

      <!-- সাইডবার -->
      <aside class="sidebar" id="sidebarPanel">
        <header class="sidebar-header">
          <button class="my-profile-btn" id="btnMyProfile">
            <div class="avatar" id="myAvatarDisplay">👤<div class="online-badge"></div></div>
            <div>
              <h2 id="myNameDisplay" style="font-size:14px; font-weight:600;">আমার নাম ✏️</h2>
              <span style="font-size:11px; color:var(--wa-green);">অনলাইন</span>
            </div>
          </button>
          <div class="header-icons">
            <button id="btnThemeToggle" class="tool-btn" title="থিম পরিবর্তন">🎨</button>
            <button id="btnLockApp" class="tool-btn" title="পিন লক">🔒</button>
            <button id="btnNewChat" class="tool-btn" title="নতুন চ্যাট">💬</button>
          </div>
        </header>

        <!-- স্টোরিজ বার -->
        <div class="stories-bar" id="storiesList">
          <div class="story-item" id="btnUploadStory">
            <div class="story-ring"><div class="story-avatar-box">+</div></div>
            <span style="font-size:10px; color:var(--wa-muted);">স্টোরি</span>
          </div>
        </div>

        <div class="search-wrap">
          <div class="search-box">
            <span style="color:var(--wa-muted);">🔍</span>
            <input id="inpSearch" placeholder="চ্যাট খুঁজুন..." />
          </div>
        </div>

        <div class="chat-list" id="chatListWrap"></div>
      </aside>

      <!-- কনভারসেশন প্যানেল -->
      <main class="conversation-panel" id="mainConversation">
        <header class="chat-top-bar">
          <div class="chat-user-view">
            <button id="btnBackSidebar" class="btn-chat-back">←</button>
            <div class="avatar" id="curPartnerAvatar">👤</div>
            <div>
              <h3 id="curPartnerName">চ্যাট নির্বাচন করুন</h3>
              <span style="font-size:11.5px; color:var(--wa-muted);">অনলাইন</span>
            </div>
          </div>
          <div class="header-icons">
            <button id="btnStartVoiceCall" class="tool-btn" title="ভয়েস কল">📞</button>
            <button id="btnStartVideoCall" class="tool-btn" title="ভিডিও কল">🎥</button>
            <button id="btnExportChat" class="tool-btn" title="ডাউনলোড চ্যাট">📥</button>
          </div>
        </header>

        <div id="pinnedMsgBanner" class="pinned-banner">
          <span id="pinnedMsgTxt">📌 পিন করা মেসেজ...</span>
          <button id="btnUnpin" style="background:none; border:none; color:var(--wa-green); cursor:pointer;">আনপিন</button>
        </div>

        <div class="chat-viewport" id="chatViewport"></div>

        <!-- ইনপুট ফুটার -->
        <footer class="chat-footer">
          <div id="replyBar" class="reply-preview-bar">
            <span id="repText">উত্তরে: ...</span>
            <button id="btnCancelRep" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
          </div>

          <button id="btnEmojiToggle" class="tool-btn" type="button">😀</button>
          <button id="btnAttachToggle" class="tool-btn" type="button">📎</button>

          <div class="footer-pill">
            <textarea id="msgInput" class="chat-input" placeholder="একটি বার্তা লিখুন..." rows="1"></textarea>
            <button id="btnVoiceToText" class="tool-btn" style="color:var(--wa-green);" title="মুখে বলে লিখুন" type="button">🗣️</button>
          </div>

          <button id="btnVoiceNote" class="tool-btn" title="ভয়েস নোট" type="button">🎤</button>
          <button id="btnSendMsg" class="btn-send-wa" type="button">➤</button>
        </footer>

        <!-- পপওভার মেনু -->
        <div id="attachMenu" class="popover-menu att-menu">
          <button id="actCamera" class="att-btn">📸 মোবাইল ক্যামেরা</button>
          <button id="actGallery" class="att-btn">🖼️ গ্যালারি ছবি</button>
          <button id="actDoodlePad" class="att-btn">🎨 ফটো ডুডল ড্রয়িং</button>
          <button id="actCreatePoll" class="att-btn">📊 পোল ভোটিং</button>
        </div>

        <div id="emojiPop" class="popover-menu emoji-pop">
          <div id="emojiGridBox" class="emoji-grid"></div>
        </div>
      </main>

    </div>
  </div>

  <!-- মোডালসমূহ -->
  <div id="modalNewChat" class="wa-modal">
    <div class="wa-modal-box">
      <h3 style="color:#fff;">নতুন চ্যাট শুরু করুন</h3>
      <input id="inpNewContact" class="wa-inp-clean" placeholder="বন্ধুর নাম লিখুন..." />
      <button id="btnConfirmNewContact" class="wa-btn-solid">চ্যাট তৈরি করুন</button>
    </div>
  </div>

  <div id="modalDoodle" class="wa-modal">
    <div class="wa-modal-box" style="max-width:300px; text-align:center;">
      <h4 style="margin-bottom:8px; color:#fff;">🎨 ফটো ডুডল ড্রয়িং</h4>
      <canvas id="doodleCanvas" width="260" height="230"></canvas>
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <button id="btnDoodleClear" class="tool-btn" style="border-radius:6px; width:auto; padding:0 8px;">মুছুন</button>
        <button id="btnDoodleSend" class="wa-btn-solid" style="width:auto; padding:6px 14px;">পাঠান</button>
      </div>
    </div>
  </div>

  <div id="modalPoll" class="wa-modal">
    <div class="wa-modal-box">
      <h4 style="margin-bottom:8px; color:#fff;">📊 পোল প্রশ্ন লিখুন</h4>

    /* ════════════ ২. সাইডবার ও চ্যাট রুমস ════════════ */
    function renderChatSidebar() {
      let contacts = JSON.parse(localStorage.getItem('wa_contacts_list') || '[]');

        <div class="chat-contact ${activeChatId === 'official_community' ? 'active' : ''}" data-id="official_community" data-name="🌟 অফিসিয়াল গ্লোবাল গ্রুপ">

    function openChatRoom(cId, cName) {
      activeChatId = cId; activeChatName = cName;
      els.curPartnerName.textContent = cName;
      els.curPartnerAvatar.textContent = cName.charAt(0).toUpperCase();

    /* ════════════ ৩. সুপারফাস্ট মেসেজিং (Zero Index Required) ════════════ */
    function loadMessagesForRoom() {
      if (unsubActiveChat) unsubActiveChat();
      els.chatViewport.innerHTML = '<div style="text-align:center; padding:10px; font-size:11.5px; color:var(--wa-muted);">🔒 এন্ড-টু-এন্ড এনক্রিপ্টেড মেসেজ</div>';

      // কোন কম্পোজিট ইনডেক্স ছাড়াই ১০০% কাজ করবে
      const q = query(collection(db, 'messages'), orderBy('createdAt', 'asc'), limit(60));
      unsubActiveChat = onSnapshot(q, snap => {
        snap.docChanges().forEach(change => {
          const m = { id: change.doc.id, ...change.doc.data() };
          if (change.type === 'added') {
            if (!m.chatId || m.chatId === activeChatId || activeChatId === 'official_community') {
              appendMessage(m);
            }
          }
        });
        els.chatViewport.scrollTop = els.chatViewport.scrollHeight;
      }, err => {
        console.error("Firestore Listen error:", err);
      });
    }

    function appendMessage(m) {
      if (document.getElementById(`msg-${m.id}`)) return;
      const isOwn = getSafeUser().uid === m.senderId;
      const row = document.createElement('div');
      row.className = `msg-row ${isOwn ? 'own' : 'other'}`;
      row.id = `msg-${m.id}`;

      let media = '';
      if (m.type === 'image') {
        media = `<img src="${m.mediaUrl}" class="msg-img" loading="lazy" />`;
      } else if (m.type === 'voice') {
        media = `
          <div class="v-player-wa" data-u="${m.mediaUrl}">
            <button class="v-play-btn" type="button">▶</button>
            <span style="font-size:11px;">ভয়েস মেসেজ</span>
          </div>`;
      } else if (m.type === 'poll') {
        let opts = '';
        (m.options || []).forEach((opt, idx) => {
          opts += `<button class="wa-btn-solid" style="margin-top:4px; font-size:12px; padding:6px;" data-idx="${idx}">${opt}</button>`;
        });
        media = `<div style="min-width:180px;"><strong>📊 ${m.text}</strong>${opts}</div>`;
      }

      let quote = m.replyTo ? `<div style="background:rgba(0,0,0,0.2); border-left:3px solid var(--wa-green); padding:3px 6px; border-radius:4px; margin-bottom:4px; font-size:11px;">${m.replyTo.text}</div>` : '';
      const textHtml = m.text && m.type !== 'poll' ? `<div>${m.text}</div>` : '';
      const tick = isOwn ? `<span class="tick-blue">✓✓</span>` : '';

      row.innerHTML = `
        <div class="msg-box">
          <div class="b-actions">
            <button class="b-act-btn" data-act="pin">📌</button>
            <button class="b-act-btn" data-act="rep">↩️</button>
            ${isOwn ? '<button class="b-act-btn" data-act="del">🗑️</button>' : ''}
          </div>
          ${quote}
          ${media}
          ${textHtml}
          <div class="meta-tag"><span>এখন</span>${tick}</div>
        </div>
      `;
      els.chatViewport.appendChild(row);
    }

    async function sendMsg(text = '', type = 'text', mediaUrl = null, extra = {}) {
      const user = getSafeUser();
      try {
        await addDoc(collection(db, 'messages'), {
          chatId: activeChatId,
          text, type, mediaUrl,
          senderId: user.uid,
          senderName: user.displayName || 'ফ্রেন্ড',
          createdAt: serverTimestamp(),
          replyTo: activeReply,
          ...extra
        });
        activeReply = null; els.replyBar.classList.remove('show');
      } catch (e) {
        showToast('মেসেজ যায়নি! Rules পাবলিশ করেছেন কি?');
        console.error(e);
      }
    }

    // 🚀 ১০০% আনলকড সেন্ড বোতাম
    els.btnSendMsg.onclick = () => {
      const t = els.msgInput.value.trim();
      if (!t) return;
      sendMsg(t, 'text');
      els.msgInput.value = ''; els.msgInput.style.height = '22px';
    };
    els.msgInput.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); els.btnSendMsg.click(); }

    /* ════════════ ৪. ক্যামেরা ও ছবি ════════════ */
    els.btnAttachToggle.onclick = e => { e.stopPropagation(); els.attachMenu.classList.toggle('show'); };
    els.actCamera.onclick = () => { els.attachMenu.classList.remove('show'); els.nativeCamInput.click(); };
    els.actGallery.onclick = () => { els.attachMenu.classList.remove('show'); els.rawGalleryInput.click(); };

    els.nativeCamInput.onchange = els.rawGalleryInput.onchange = async e => {
      const f = e.target.files[0];
      if (f) {
        showToast('ছবি প্রস্তুত হচ্ছে...');
        const b64 = await compressPhoto(f);
        sendMsg('', 'image', b64);
      }
      e.target.value = '';
    };

    function compressPhoto(file) {
      return new Promise(res => {
        const r = new FileReader(); r.readAsDataURL(file);
        r.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            let w = img.width, h = img.height, max = 450;
            if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
            else if (h > max) { w = Math.round((w * max) / h); h = max; }
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            res(c.toDataURL('image/jpeg', 0.5));
          };
          img.src = ev.target.result;
        };
      });
    }

    /* ════════════ ৫. ভয়েস ও অডিও কল ════════════ */
    els.btnVoiceNote.onclick = async () => {
      if (!isRecordingVoice) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const r = new FileReader();
            r.onloadend = () => sendMsg('', 'voice', r.result);
            r.readAsDataURL(blob);
          };
          mediaRecorder.start();
          isRecordingVoice = true;
          els.btnVoiceNote.style.color = '#ef4444';
          showToast('🎤 কথা বলুন, শেষ হলে আবার চাপুন');
        } catch (e) { showToast('মাইক্রোফোন পারমিশন দিন'); }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isRecordingVoice = false;
        els.btnVoiceNote.style.color = 'var(--wa-muted)';
      }
    };

    // অডিও ও ভিডিও কল
    els.btnStartVoiceCall.onclick = () => startCall('audio');
    els.btnStartVideoCall.onclick = () => startCall('video');

    async function startCall(type) {
      els.callScreen.classList.add('show');
      els.callPeerTitle.textContent = activeChatName;
      els.remoteVideo.style.display = type === 'video' ? 'block' : 'none';
      els.localVideo.style.display = type === 'video' ? 'block' : 'none';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true },
          video: type === 'video' ? { facingMode: 'user', width: 480 } : false
        });
        els.localVideo.srcObject = localStream;
        els.localVideo.muted = true; // জিরো ইকো

        peerConn = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));

        peerConn.ontrack = e => {
          if (e.streams && e.streams[0]) {
            els.remoteVideo.srcObject = e.streams[0];
          }
        };

        const start = Date.now();
        callTimerId = setInterval(() => {
          const s = Math.floor((Date.now() - start) / 1000);
          els.callDurationTimer.textContent = `${Math.floor(s/60)}:${s%60 < 10 ? '0' : ''}${s%60}`;
        }, 1000);
      } catch (err) {
        showToast('ক্যামেরা/মাইক পারমিশন দিন');
      }
    }

    els.btnEndCall.onclick = () => {
      if (callTimerId) clearInterval(callTimerId);
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConn) peerConn.close();
      els.callScreen.classList.remove('show', 'minimized');
      showToast('কল শেষ');
    };
    els.btnMinimizeCall.onclick = () => els.callScreen.classList.toggle('minimized');
    els.btnMuteMic.onclick = () => {
      if (localStream) {
        isMicMuted = !isMicMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
        els.btnMuteMic.textContent = isMicMuted ? '🔇' : '🎤';
      }
    };

    /* ════════════ ৬. স্টোরিজ বার ════════════ */
    function listenStories() {
      const q = query(collection(db, 'stories'), limit(15));
      onSnapshot(q, snap => {
        let html = `
          <div class="story-item" id="btnUploadStory">
            <div class="story-ring add-ring"><div class="story-avatar-box">+</div></div>
            <span style="font-size:10px; color:var(--wa-muted);">আমার স্টোরি</span>
          </div>
        `;
        snap.docs.forEach(d => {
          const s = d.data();
          html += `
            <div class="story-item" data-url="${s.url}">
              <div class="story-ring"><div class="story-avatar-box">${s.name ? s.name.charAt(0).toUpperCase() : '🌸'}</div></div>
              <span style="font-size:10px; color:var(--wa-muted);">${s.name || 'বন্ধু'}</span>
            </div>
          `;
        });
        els.storiesList.innerHTML = html;
        document.getElementById('btnUploadStory').onclick = () => els.rawStoryInput.click();
      }, err => console.log(err));
    }

    els.rawStoryInput.onchange = async e => {
      const f = e.target.files[0];
      if (f) {
        showToast('স্টোরি আপলোড হচ্ছে...');
        const b64 = await compressPhoto(f);
        await addDoc(collection(db, 'stories'), { url: b64, name: getSafeUser().displayName, createdAt: Date.now() });
        showToast('স্টোরি পোস্ট হয়েছে!');
      }
    };

    /* ════════════ ৭. ডুডল, পোল ও ইমোজি ════════════ */
    els.actCreatePoll.onclick = () => { els.attachMenu.classList.remove('show'); els.modalPoll.classList.add('show'); };
    els.btnSubmitPoll.onclick = () => {
      const q = els.inpPollQuestion.value.trim(), o1 = els.inpPollOpt1.value.trim(), o2 = els.inpPollOpt2.value.trim();
      if (!q || !o1 || !o2) return;
      sendMsg(q, 'poll', null, { options: [o1, o2] });
      els.inpPollQuestion.value = ''; els.inpPollOpt1.value = ''; els.inpPollOpt2.value = '';
      els.modalPoll.classList.remove('show');
    };

    // ডুডল ক্যানভাস
    const dCvs = els.doodleCanvas, dCtx = dCvs.getContext('2d');
    let isDrawing = false;
    dCtx.strokeStyle = '#00a884'; dCtx.lineWidth = 3;
    els.actDoodlePad.onclick = () => { els.attachMenu.classList.remove('show'); els.modalDoodle.classList.add('show'); };
    els.btnDoodleClear.onclick = () => dCtx.clearRect(0,0,dCvs.width,dCvs.height);
    els.btnDoodleSend.onclick = () => {
      sendMsg('', 'image', dCvs.toDataURL('image/png'));
      els.btnDoodleClear.click(); els.modalDoodle.classList.remove('show');
    };
    function getP(e) {
      const r = dCvs.getBoundingClientRect(), ev = e.touches ? e.touches[0] : e;
      return [ev.clientX - r.left, ev.clientY - r.top];
    }
    dCvs.onmousedown = dCvs.ontouchstart = e => { isDrawing = true; dCtx.beginPath(); dCtx.moveTo(...getP(e)); };
    dCvs.onmousemove = dCvs.ontouchmove = e => { if (isDrawing) { dCtx.lineTo(...getP(e)); dCtx.stroke(); } };
    window.onmouseup = window.ontouchend = () => isDrawing = false;

    // ইমোজি
    els.btnEmojiToggle.onclick = e => { e.stopPropagation(); els.emojiPop.classList.toggle('show'); };
    els.emojiGridBox.innerHTML = EMOJIS.map(em => `<button class="em-btn">${em}</button>`).join('');
    els.emojiGridBox.onclick = e => {
      if (e.target.classList.contains('em-btn')) els.msgInput.value += e.target.textContent;
    };

    // অ্যাকশন ডেলিগেশন
    els.chatViewport.onclick = async e => {
      const v = e.target.closest('.v-play-btn');
      if (v) {
        const audio = new Audio(v.closest('.v-player-wa').dataset.u);
        v.textContent = '⏸'; audio.play();
        audio.onended = () => v.textContent = '▶';
        return;
      }
      const act = e.target.closest('.b-act-btn');
      if (act) {
        const row = act.closest('.msg-row');
        const id = row.id.replace('msg-', '');
        const a = act.dataset.act;
        if (a === 'del') {
          await updateDoc(doc(db, 'messages', id), { text: 'মেসেজ মুছে ফেলা হয়েছে 🚫', type: 'text', mediaUrl: null });
        } else if (a === 'pin') {
          els.pinnedMsgTxt.textContent = row.querySelector('.msg-box').innerText;
          els.pinnedMsgBanner.classList.add('show');
          showToast('মেসেজ পিন হয়েছে 📌');
        } else if (a === 'rep') {
          activeReply = { id, text: row.querySelector('.msg-box')?.innerText || 'মেসেজ' };
          els.repText.textContent = `উত্তরে: ${activeReply.text}`;
          els.replyBar.classList.add('show');
        }
      }
    };
    els.btnUnpin.onclick = () => els.pinnedMsgBanner.classList.remove('show');
    els.btnCancelRep.onclick = () => { activeReply = null; els.replyBar.classList.remove('show'); };

    // এক্সপোর্ট হিস্ট্রি
    els.btnExportChat.onclick = () => {
      const txt = els.chatViewport.innerText;
      const b = new Blob([txt], { type: 'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'chat.txt'; a.click();
    };

    document.onclick = () => { els.attachMenu.classList.remove('show'); els.emojiPop.classList.remove('show'); };

    initWhatsAppEngine();
  </script>
</body>
</html>
