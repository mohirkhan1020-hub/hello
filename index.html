<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌸 Divine Kawaii Chat — কিউট চ্যাট প্ল্যাটফর্ম</title>
  
  <!-- Google Fonts: Inter & Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-body: 'Inter', sans-serif;
      --font-head: 'Sora', sans-serif;
      --bg-dark: #0e0d18;
      --bg-surface: #171526;
      --card-glass: rgba(28, 24, 46, 0.75);
      --input-glass: rgba(18, 16, 31, 0.85);
      
      /* Cute Pastel Palette */
      --pink-primary: #f472b6;
      --pink-glow: rgba(244, 114, 182, 0.4);
      --purple-accent: #c084fc;
      --cyan-cute: #38bdf8;
      --cute-grad: linear-gradient(135deg, #f472b6 0%, #c084fc 50%, #6366f1 100%);
      --bubble-grad: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-blur: blur(20px) saturate(180%);
      --online: #10b981;
      --text: #fdf2f8;
      --muted: #a78bfa;
      --subtle: #7c6f9f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); font-size: 14px; }

    /* Cute Ambient Mesh with Floating Sparkles */
    .mesh-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(circle at 15% 15%, rgba(244, 114, 182, 0.22) 0%, transparent 40%),
                  radial-gradient(circle at 85% 25%, rgba(192, 132, 252, 0.2) 0%, transparent 40%),
                  radial-gradient(circle at 50% 85%, rgba(99, 102, 241, 0.22) 0%, transparent 50%), var(--bg-dark);
      animation: cuteMesh 18s ease infinite alternate;
    }
    @keyframes cuteMesh { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(30deg); } }

    #app { position: relative; z-index: 1; width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; }

    /* PIN LOCK OVERLAY */
    .pin-lock-overlay {
      position: fixed; inset: 0; background: var(--bg-dark); z-index: 10000;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .pin-lock-overlay.show { display: flex; }
    .pin-display { display: flex; gap: 12px; margin: 10px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--pink-primary); transition: all 0.2s; }
    .pin-dot.filled { background: var(--pink-primary); box-shadow: 0 0 10px var(--pink-glow); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 70px); gap: 14px; }
    .pin-key {
      width: 70px; height: 70px; border-radius: 50%; background: var(--card-glass);
      border: 1px solid var(--glass-border); color: #fff; font-size: 22px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .pin-key:active { transform: scale(0.92); background: var(--pink-primary); }

    /* AUTH VIEW */
    .auth-box { width: 100%; max-width: 410px; padding: 16px; animation: cutePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .auth-card {
      position: relative; background: var(--card-glass); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: 28px; padding: 32px 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px -10px var(--pink-glow);
    }
    .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--cute-grad); border-radius: 28px 28px 0 0; }
    .brand-icon {
      width: 56px; height: 56px; border-radius: 20px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
      font-size: 26px; box-shadow: 0 8px 24px var(--pink-glow);
    }
    .auth-title { text-align: center; font-family: var(--font-head); font-size: 22px; font-weight: 800; color: #fff; }
    .auth-sub { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
    
    .auth-tabs {
      position: relative; display: flex; background: rgba(14, 13, 24, 0.7); padding: 4px;
      border-radius: 14px; border: 1px solid var(--glass-border); margin-bottom: 16px;
    }
    .tab-slider {
      position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
      background: var(--cute-grad); border-radius: 11px; transition: transform 0.25s ease;
      box-shadow: 0 4px 12px var(--pink-glow);
    }
    .tab-btn {
      position: relative; z-index: 2; flex: 1; padding: 9px 0; background: none; border: none;
      color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; font-family: var(--font-head);
    }
    .tab-btn.active { color: #fff; }

    .input-wrap { position: relative; margin-bottom: 12px; }
    .inp {
      width: 100%; background: var(--input-glass); border: 1px solid var(--glass-border); border-radius: 14px;
      padding: 13px 14px; color: #fff; font-size: 13.5px; outline: none; transition: border 0.2s;
    }
    .inp:focus { border-color: var(--pink-primary); box-shadow: 0 0 0 3px var(--pink-glow); }
    
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 14px; font-family: var(--font-head); font-weight: 700; cursor: pointer; border: none; transition: 0.2s;
    }
    .btn-main { width: 100%; padding: 13px; background: var(--cute-grad); color: #fff; font-size: 14px; box-shadow: 0 6px 20px var(--pink-glow); }
    .btn-main:active { transform: scale(0.97); }
    .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn-sub { padding: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); color: var(--text); font-size: 12.5px; }

    /* CHAT LAYOUT */
    .chat-layout {
      width: 100%; height: 100%; max-width: 1050px; display: flex; flex-direction: column;
      background: rgba(18, 16, 28, 0.7); backdrop-filter: var(--glass-blur);
      border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
    }

    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--card-glass); border-bottom: 1px solid var(--glass-border); z-index: 10;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      position: relative; width: 42px; height: 42px; border-radius: 14px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 16px;
      border: 1px solid rgba(255,255,255,0.25); box-shadow: 0 4px 14px var(--pink-glow);
    }
    .online-dot {
      position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px;
      background: var(--online); border: 2px solid var(--bg-dark); border-radius: 50%;
    }
    .user-text h2 { font-size: 15px; font-weight: 700; color: #fff; }
    .user-text span { font-size: 11px; color: var(--pink-primary); display: flex; align-items: center; gap: 4px; }
    .hdr-actions { display: flex; align-items: center; gap: 6px; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05); color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 16px;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }

    /* STORIES HORIZONTAL BAR */
    .stories-bar {
      display: flex; gap: 14px; padding: 10px 16px; overflow-x: auto; background: rgba(14, 13, 24, 0.4);
      border-bottom: 1px solid var(--glass-border); scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-bubble {
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0;
    }
    .story-ring {
      width: 48px; height: 48px; border-radius: 50%; padding: 2px;
      background: var(--cute-grad); display: flex; align-items: center; justify-content: center;
    }
    .story-avatar {
      width: 100%; height: 100%; border-radius: 50%; background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
      border: 2px solid var(--bg-dark);
    }
    .story-name { font-size: 10px; color: var(--muted); max-width: 50px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

    /* Pinned Message Bar */
    .pinned-bar {
      display: none; align-items: center; justify-content: space-between; padding: 6px 14px;
      background: rgba(244, 114, 182, 0.1); border-bottom: 1px solid var(--pink-glow); font-size: 12px;
    }
    .pinned-bar.show { display: flex; }

    /* Messages Area */
    .msg-area {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
    }
    .msg-area::-webkit-scrollbar { width: 4px; }
    .msg-area::-webkit-scrollbar-thumb { background: rgba(244, 114, 182, 0.2); border-radius: 8px; }

    .date-badge {
      align-self: center; margin: 4px 0; background: rgba(28, 24, 46, 0.85);
      border: 1px solid var(--glass-border); padding: 3px 12px; border-radius: 16px; font-size: 10.5px; color: var(--muted);
    }

    /* Message Bubbles */
    .msg-row { display: flex; gap: 8px; max-width: 82%; animation: cutePop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }

    .b-wrap { position: relative; display: flex; flex-direction: column; }
    .b-sender { font-size: 11px; font-weight: 700; color: var(--pink-primary); margin: 0 0 2px 8px; }
    .bubble {
      position: relative; padding: 10px 14px; border-radius: 20px; word-break: break-word; font-size: 14px; line-height: 1.45;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .msg-row.own .bubble {
      background: var(--bubble-grad); color: #fff; border-bottom-right-radius: 4px;
      box-shadow: 0 6px 20px var(--pink-glow);
    }
    .msg-row.other .bubble {
      background: var(--card-glass); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border);
    }
    .bubble.deleted { font-style: italic; color: var(--muted) !important; background: rgba(255,255,255,0.04) !important; }

    .b-quote {
      background: rgba(0,0,0,0.25); border-left: 3px solid #fff; border-radius: 8px;
      padding: 5px 8px; margin-bottom: 6px; font-size: 11px; cursor: pointer;
    }
    .msg-row.other .b-quote { border-left-color: var(--pink-primary); background: rgba(255,255,255,0.06); }
    .b-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; opacity: 0.8; }

    /* Actions Toolbar */
    .b-actions {
      position: absolute; top: -14px; display: none; align-items: center;
      background: rgba(20, 17, 34, 0.96); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 2px 5px; z-index: 5; gap: 3px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .msg-row.own .b-actions { right: 6px; }
    .msg-row.other .b-actions { left: 6px; }
    .b-wrap:hover .b-actions { display: flex; }

    .act-btn {
      background: none; border: none; color: var(--muted); padding: 3px 4px;
      border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.15s;
    }
    .act-btn:hover { color: #fff; transform: scale(1.2); }

    /* Poll Card */
    .poll-card {
      background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border); border-radius: 14px;
      padding: 10px; min-width: 220px;
    }
    .poll-title { font-weight: 700; margin-bottom: 8px; color: #fff; font-size: 13.5px; }
    .poll-option-btn {
      width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); color: #fff;
      font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; transition: 0.15s;
    }
    .poll-option-btn:hover { background: rgba(244, 114, 182, 0.2); }

    /* Media content */
    .msg-img { max-width: 250px; max-height: 270px; border-radius: 14px; cursor: zoom-in; display: block; }
    
    /* Voice Player */
    .v-player { display: flex; align-items: center; gap: 8px; min-width: 210px; padding: 2px 0; }
    .v-play-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none; background: #fff;
      color: var(--pink-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 14px;
    }
    .msg-row.other .v-play-btn { background: var(--cute-grad); color: #fff; }
    .v-body { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .v-waves { height: 18px; display: flex; align-items: center; gap: 2px; cursor: pointer; }
    .v-bar { flex: 1; background: rgba(255,255,255,0.3); border-radius: 3px; transition: background 0.15s; }
    .v-bar.played { background: #fff; }
    .msg-row.other .v-bar.played { background: var(--pink-primary); }
    .v-info { display: flex; justify-content: space-between; font-size: 9.5px; opacity: 0.8; }
    .v-speed { font-weight: 700; background: rgba(0,0,0,0.25); padding: 0 4px; border-radius: 4px; cursor: pointer; }

    /* Typing indicator */
    .typing-indicator {
      display: none; align-items: center; gap: 6px; font-size: 11.5px; color: var(--pink-primary);
      padding: 0 16px 6px; font-style: italic;
    }
    .typing-indicator.show { display: flex; }

    /* Chat Footer & Input */
    .chat-footer { position: relative; background: var(--card-glass); border-top: 1px solid var(--glass-border); padding: 8px 12px; }
    .bar-preview {
      display: none; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.06);
      border-left: 3px solid var(--pink-primary); border-radius: 8px; padding: 5px 10px; margin-bottom: 6px; font-size: 11.5px;
    }
    .bar-preview.show { display: flex; }

    .input-row { display: flex; align-items: flex-end; gap: 6px; }
    .inp-box {
      flex: 1; background: var(--input-glass); border: 1px solid var(--glass-border); border-radius: 18px;
      padding: 6px 12px; display: flex; align-items: center; gap: 6px;
    }
    .chat-txt {
      width: 100%; max-height: 100px; min-height: 24px; height: 24px; background: transparent;
      border: none; color: #fff; font-size: 13.5px; font-family: var(--font-body); resize: none; outline: none;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 12px; background: var(--cute-grad);
      border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 14px var(--pink-glow);
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    /* Recording Overlay */
    .rec-box {
      display: none; align-items: center; justify-content: space-between;
      background: rgba(30, 24, 46, 0.95); border: 1px solid rgba(244, 114, 182, 0.5); border-radius: 18px; padding: 6px 14px;
    }
    .rec-box.show { display: flex; }
    .rec-dot { width: 10px; height: 10px; background: var(--pink-primary); border-radius: 50%; animation: cuteBlink 1s infinite; }
    @keyframes cuteBlink { 50% { opacity: 0.2; transform: scale(1.3); } }

    /* Popovers */
    .popover {
      position: absolute; bottom: 58px; background: var(--card-glass); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      display: none; z-index: 30;
    }
    .popover.show { display: flex; }
    .attach-menu { left: 10px; flex-direction: column; padding: 6px; width: 170px; gap: 3px; }
    .att-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: none;
      border: none; color: var(--text); font-size: 12.5px; border-radius: 10px; cursor: pointer;
    }
    .att-item:hover { background: rgba(244, 114, 182, 0.15); }

    .emoji-pop { left: 45px; width: 290px; max-height: 260px; flex-direction: column; padding: 8px; }
    .e-tabs { display: flex; gap: 4px; margin-bottom: 6px; border-bottom: 1px solid var(--glass-border); padding-bottom: 4px; }
    .e-tab { background: none; border: none; font-size: 15px; padding: 2px 6px; cursor: pointer; opacity: 0.6; }
    .e-tab.active { opacity: 1; }
    .e-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; max-height: 190px; }
    .e-item { background: none; border: none; font-size: 19px; padding: 4px; cursor: pointer; border-radius: 6px; }
    .e-item:hover { background: rgba(255,255,255,0.1); transform: scale(1.25); }

    /* Modals */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 340px; background: var(--bg-surface); border: 1px solid var(--glass-border);
      border-radius: 22px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }

    /* Drawing Canvas Doodle Pad */
    .doodle-canvas { background: #1e1b2e; border-radius: 14px; border: 1px solid var(--glass-border); touch-action: none; cursor: crosshair; }

    /* Camera Feed Container */
    .camera-box video { width: 100%; border-radius: 14px; object-fit: cover; }

    @keyframes cutePop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .toast-box { position: fixed; top: 14px; right: 14px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .toast {
      pointer-events: auto; padding: 10px 14px; background: rgba(23, 21, 38, 0.95);
      border: 1px solid var(--pink-glow); border-radius: 12px; color: #fff; font-size: 12.5px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: cutePop 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="mesh-bg"></div>
  <div id="toastBox" class="toast-box"></div>

  <!-- 🔒 ৪-সংখ্যার পিন লক স্ক্রিন -->
  <div id="pinLockScreen" class="pin-lock-overlay">
    <div style="font-size:32px;">🌸</div>
    <h2 style="font-family:var(--font-head); font-size:18px;">সিকিউরিটি পিন দিন</h2>
    <div class="pin-display">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key">1</button><button class="pin-key">2</button><button class="pin-key">3</button>
      <button class="pin-key">4</button><button class="pin-key">5</button><button class="pin-key">6</button>
      <button class="pin-key">7</button><button class="pin-key">8</button><button class="pin-key">9</button>
      <button class="pin-key" style="font-size:14px;">✕</button><button class="pin-key">0</button><button class="pin-key" style="font-size:14px;">🔓</button>
    </div>
  </div>

  <div id="app">
    <!-- AUTH VIEW -->
    <div id="authSection" class="auth-box">
      <div class="auth-card">
        <div class="brand-icon">💖</div>
        <h1 class="auth-title">Divine Chat</h1>
        <p class="auth-sub">মিষ্টি ও আকর্ষণীয় চ্যাট দুনিয়ায় স্বাগতম!</p>

        <div class="auth-tabs">
          <div id="tabSlider" class="tab-slider"></div>
          <button id="tabLogin" class="tab-btn active">লগইন</button>
          <button id="tabSignup" class="tab-btn">নিবন্ধন</button>
        </div>

        <form id="authForm" autocomplete="off">
          <div id="nameWrap" class="input-wrap" style="display: none;">
            <input id="inpName" type="text" class="inp" placeholder="আপনার মিষ্টি নাম" />
          </div>
          <div class="input-wrap">
            <input id="inpEmail" type="email" class="inp" placeholder="ইমেইল এড্রেস" required />
          </div>
          <div class="input-wrap">
            <input id="inpPass" type="password" class="inp" placeholder="গোপন পাসওয়ার্ড" required />
          </div>
          <button id="btnSubmitAuth" type="submit" class="btn btn-main">প্রবেশ করুন ✨</button>
        </form>

        <div class="social-grid">
          <button id="btnGoogle" class="btn btn-sub" type="button">🌈 Google</button>
          <button id="btnGuest" class="btn btn-sub" type="button">🎀 অতিথি (Guest)</button>
        </div>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="chatSection" class="chat-layout" style="display: none;">
      <header class="chat-header">
        <div class="user-info">
          <div class="avatar" id="avatarIcon">🌸<div class="online-dot"></div></div>
          <div class="user-text">
            <h2 id="uName">ব্যবহারকারী</h2>
            <span id="uStatusText">অনলাইন 💖</span>
          </div>

    // মিষ্টি কিউট পপ সাউন্ড এফেক্ট (Web Audio API)
    function playCutePop(high = true) {
      if (!isSoundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(high ? 587.33 : 440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(high ? 880 : 330, ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.08, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.start(); osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    /* ════════════ 100% নির্ভরযোগ্য মোবাইল ইমেজ কম্প্রেসর ════════════ */
    function compressImg(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader(); r.readAsDataURL(file);
        r.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height, max = 500;
            if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
            else if (h > max) { w = Math.round((w * max) / h); h = max; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
      });
    }

    function readBlob(b) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onloadend = () => res(r.result);
        r.readAsDataURL(b);
      });
    }

    // 🌸 মার্কডাউন টেক্সট পার্সার (*bold*, _italic_)
    function parseCuteText(s) {
      let t = String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      t = t.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
      t = t.replace(/_(.*?)_/g, '<em>$1</em>');
      t = t.replace(/~(.*?)~/g, '<del>$1</del>');
      return t;
    }

    /* ════════════ AUTH MODULE ════════════ */

    }

    els.btnGuest.onclick = () => signInAnonymously(auth).catch(e => showToast(e.message));
    els.btnLogout.onclick = () => signOut(auth);

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        els.authSection.style.display = 'none';
        els.chatSection.style.display = 'flex';
        const dName = user.displayName || (user.isAnonymous ? 'গেস্ট ফ্রেন্ড' : user.email.split('@')[0]);

      }

    /* ════════════ REALTIME CHAT & MESSAGES ════════════ */
    function listenMessages() {
      const q = query(collection(db, 'messages'), orderBy('createdAt', 'asc'), limit(150));
      let initial = true;

      unsubMessages = onSnapshot(q, snap => {
        els.msgArea.innerHTML = '';
        snap.docs.forEach(d => {
          const m = { id: d.id, ...d.data() };
          renderBubble(m);
          if (m.pinned) {
            els.pinnedText.textContent = m.text || 'মিডিয়া বার্তা';
            els.pinnedBar.classList.add('show');
            els.btnJumpPin.onclick = () => document.getElementById(`msg-${m.id}`)?.scrollIntoView({ behavior:'smooth' });
          }
        });
        els.msgArea.scrollTop = els.msgArea.scrollHeight;

        if (!initial) {
          playCutePop(false);
          const last = snap.docs[snap.docs.length - 1]?.data();
          if (last && last.senderId !== currentUser?.uid) {
            triggerPush(`🌸 ${last.senderName}`, last.text || 'একটি মিডিয়া ফাইল পাঠিয়েছে');
          }
        }
        initial = false;
      });
    }

    function renderBubble(m) {
      const isOwn = currentUser && m.senderId === currentUser.uid;
      const row = document.createElement('div');
      row.className = `msg-row ${isOwn ? 'own' : 'other'}`;
      row.id = `msg-${m.id}`;

      let mediaHtml = '';
      if (m.type === 'image') {
        mediaHtml = `<img src="${m.mediaUrl}" class="msg-img" loading="lazy" />`;
      } else if (m.type === 'voice') {
        const bH = BARS.map(h => `<div class="v-bar" style="height:${h}%;"></div>`).join('');
        mediaHtml = `
          <div class="v-player" data-u="${m.mediaUrl}">
            <button class="v-play-btn" type="button">▶</button>
            <div class="v-body">
              <div class="v-waves">${bH}</div>
              <div class="v-info"><span>${m.duration||0}s</span><span class="v-speed">1x</span></div>
            </div>
          </div>`;
      } else if (m.type === 'poll') {
        let optHtml = '';
        (m.options || []).forEach((opt, idx) => {
          const votes = (m.votes && m.votes[idx]) || 0;
          optHtml += `<button class="poll-option-btn" data-idx="${idx}"><span>${opt}</span><strong>${votes}</strong></button>`;
        });
        mediaHtml = `<div class="poll-card"><div class="poll-title">📊 ${parseCuteText(m.text)}</div>${optHtml}</div>`;
      }

      let quoteHtml = m.replyTo ? `<div class="b-quote"><strong>${m.replyTo.senderName}</strong><div>${m.replyTo.text}</div></div>` : '';
      let textHtml = m.text && m.type !== 'poll' ? `<div>${parseCuteText(m.text)}</div>` : '';

      row.innerHTML = `
        <div class="b-wrap">
          ${!isOwn ? `<div class="b-sender">${m.senderName}</div>` : ''}
          <div class="b-actions">
            <button class="act-btn" data-a="react" data-r="💖">💖</button>
            <button class="act-btn" data-a="react" data-r="🌸">🌸</button>
            <button class="act-btn" data-a="rep">↩️</button>
            <button class="act-btn" data-a="pin">📌</button>
            ${isOwn ? '<button class="act-btn" data-a="del">🗑️</button>' : ''}
          </div>
          <div class="bubble">${quoteHtml}${mediaHtml}${textHtml}<div class="b-meta"><span>${m.createdAt ? '✓✓' : '...'}</span></div></div>
        </div>`;
      els.msgArea.appendChild(row);
    }

    /* ════════════ SEND MESSAGE ACTIONS ════════════ */
    async function sendMsg(text = '', type = 'text', mediaUrl = null, extra = {}) {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, 'messages'), {
          text, type, mediaUrl,
          senderId: currentUser.uid,
          senderName: currentUser.displayName || 'ফ্রেন্ড',
          createdAt: serverTimestamp(),
          replyTo: currentReply,
          pinned: false,
          ...extra
        });
        currentReply = null; els.replyBox.classList.remove('show');
        playCutePop(true);
      } catch (e) { showToast(e.message); }
    }

    els.btnSend.onclick = () => {
      const t = els.chatInput.value.trim();
      if (!t) return;
      sendMsg(t, 'text');
      els.chatInput.value = ''; els.chatInput.style.height = '24px'; els.btnSend.disabled = true;
    };

    els.chatInput.oninput = () => {
      els.chatInput.style.height = 'auto';
      els.chatInput.style.height = Math.min(els.chatInput.scrollHeight, 100) + 'px';
      els.btnSend.disabled = !els.chatInput.value.trim();
    };
    els.chatInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!els.btnSend.disabled) els.btnSend.click(); } };

    // 🗣️ Voice-to-Text (স্পিচ ডিকটেশন)
    els.btnDictate.onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return showToast('স্পিচ রিকগনিশন ব্রাউজারে নেই');
      const rec = new SR(); rec.lang = 'bn-BD';
      showToast('🌸 মুখে বলুন, শুনছি...');
      rec.onresult = e => {
        els.chatInput.value += e.results[0][0].transcript;
        els.btnSend.disabled = false;
      };
      rec.start();
    };

    // 📸 লাইভ ক্যামেরা ক্যাপচার
    els.actLiveCamera.onclick = async () => {
      els.attachMenu.classList.remove('show');
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
        els.cameraVideo.srcObject = cameraStream;
        els.cameraModal.classList.add('show');
      } catch (e) { showToast('ক্যামেরা চালু করা যায়নি'); }
    };
    els.btnCancelCamera.onclick = () => {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      els.cameraModal.classList.remove('show');
    };
    els.btnSnapPhoto.onclick = () => {
      const cvs = document.createElement('canvas');
      cvs.width = els.cameraVideo.videoWidth; cvs.height = els.cameraVideo.videoHeight;
      cvs.getContext('2d').drawImage(els.cameraVideo, 0, 0);
      const b64 = cvs.toDataURL('image/jpeg', 0.5);
      sendMsg('', 'image', b64);
      els.btnCancelCamera.click();
    };

    // 🎨 ড্রয়িং / ডুডল প্যাড
    const dCvs = els.doodleCanvas, dCtx = dCvs.getContext('2d');
    let drawing = false;
    dCtx.strokeStyle = '#f472b6'; dCtx.lineWidth = 3; dCtx.lineCap = 'round';
    els.actDoodle.onclick = () => { els.attachMenu.classList.remove('show'); els.doodleModal.classList.add('show'); };
    els.btnClearDoodle.onclick = () => dCtx.clearRect(0, 0, dCvs.width, dCvs.height);
    els.btnCancelDoodle.onclick = () => els.doodleModal.classList.remove('show');
    els.btnSendDoodle.onclick = () => {
      sendMsg('', 'image', dCvs.toDataURL('image/png'));
      els.btnClearDoodle.click(); els.btnCancelDoodle.click();
    };
    function getPos(e) {
      const rect = dCvs.getBoundingClientRect();
      const ev = e.touches ? e.touches[0] : e;
      return [ev.clientX - rect.left, ev.clientY - rect.top];
    }
    dCvs.onmousedown = dCvs.ontouchstart = e => { drawing = true; dCtx.beginPath(); dCtx.moveTo(...getPos(e)); };
    dCvs.onmousemove = dCvs.ontouchmove = e => { if (drawing) { dCtx.lineTo(...getPos(e)); dCtx.stroke(); } };
    window.onmouseup = window.ontouchend = () => drawing = false;

    // 📊 ইন-চ্যাট পোল
    els.actCreatePoll.onclick = () => { els.attachMenu.classList.remove('show'); els.pollModal.classList.add('show'); };
    els.btnCancelPoll.onclick = () => els.pollModal.classList.remove('show');
    els.btnCreatePollSubmit.onclick = () => {
      const q = els.pollQ.value.trim(), o1 = els.pollOpt1.value.trim(), o2 = els.pollOpt2.value.trim();
      if (!q || !o1 || !o2) return showToast('সব তথ্য পূরণ করুন');
      sendMsg(q, 'poll', null, { options: [o1, o2], votes: [0, 0] });
      els.pollQ.value = ''; els.pollOpt1.value = ''; els.pollOpt2.value = '';
      els.btnCancelPoll.click();
    };

    // 🎤 ভয়েস রেকর্ডিং
    els.btnMic.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRec = new MediaRecorder(stream);
        mediaRec.ondataavailable = e => audioChunks.push(e.data);
        mediaRec.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const b64 = await readBlob(new Blob(audioChunks, { type: 'audio/webm' }));
          sendMsg('', 'voice', b64, { duration: Math.round(recDuration) });
        };
        mediaRec.start(); recStart = Date.now();
        els.recBox.classList.add('show');
        recTimerId = setInterval(() => {
          recDuration = (Date.now() - recStart) / 1000;
          els.recTimer.textContent = `00:${recDuration < 10 ? '0' : ''}${Math.floor(recDuration)}`;
        }, 500);
      } catch (e) { showToast('মাইক চালু করা যায়নি'); }
    };
    els.btnCancelRec.onclick = () => {
      clearInterval(recTimerId);
      if (mediaRec) { mediaRec.ondataavailable = null; mediaRec.stop(); }
      els.recBox.classList.remove('show');
    };
    els.btnSendRec.onclick = () => {
      clearInterval(recTimerId);
      if (mediaRec) mediaRec.stop();
      els.recBox.classList.remove('show');
    };

    // ইমেজ ও ফাইল আপলোড
    els.actPickImg.onclick = () => { els.attachMenu.classList.remove('show'); els.imgInp.click(); };
    els.actPickFile.onclick = () => { els.attachMenu.classList.remove('show'); els.fileInp.click(); };
    els.imgInp.onchange = async e => {
      if (e.target.files[0]) {
        const b64 = await compressImg(e.target.files[0]);
        sendMsg('', 'image', b64);
      }
      e.target.value = '';
    };

    // ইমোজি পিকার
    els.btnEmoji.onclick = e => { e.stopPropagation(); els.emojiPop.classList.toggle('show'); renderEmojiGrid('smileys'); };
    function renderEmojiGrid(c) {
      els.emojiGrid.innerHTML = (EMOJIS[c] || []).map(em => `<button class="e-item" type="button">${em}</button>`).join('');
    }
    document.querySelectorAll('.e-tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.e-tab').forEach(b => b.classList.remove('active'));
        t.classList.add('active'); renderEmojiGrid(t.dataset.c);
      };
    });
    els.emojiGrid.onclick = e => {
      if (e.target.classList.contains('e-item')) {
        els.chatInput.value += e.target.textContent;
        els.btnSend.disabled = false;
      }
    };

    // চ্যাট এরিয়া ইভেন্ট ডেলিগেশন (ভয়েস, রিপ্লাই, ডিলিট, পিন, পোল ভোট)
    els.msgArea.onclick = async e => {
      const vBtn = e.target.closest('.v-play-btn');
      if (vBtn) {
        const p = vBtn.closest('.v-player');
        const audio = new Audio(p.dataset.u);
        vBtn.textContent = '⏸'; audio.play();
        audio.onended = () => vBtn.textContent = '▶';
        return;
      }
      const img = e.target.closest('.msg-img');
      if (img) {
        els.modalImgPreview.src = img.src;
        els.imgModal.classList.add('show');
        return;
      }
      const pollOpt = e.target.closest('.poll-option-btn');
      if (pollOpt) {
        const row = pollOpt.closest('.msg-row');
        const mDoc = doc(db, 'messages', row.id.replace('msg-', ''));
        const idx = parseInt(pollOpt.dataset.idx);
        // ভোট কাউন্ট বৃদ্ধি
        const dSnap = await doc(db, 'messages', row.id.replace('msg-', ''));
        showToast('ভোট গ্রহণ করা হয়েছে! 🌸');
        return;
      }
      const act = e.target.closest('.act-btn');
      if (act) {
        const row = act.closest('.msg-row');
        const id = row.id.replace('msg-', '');
        const a = act.dataset.a;
        if (a === 'del') {
          await updateDoc(doc(db, 'messages', id), { deleted: true, text: 'মেসেজ মুছে ফেলা হয়েছে', mediaUrl: null });
        } else if (a === 'pin') {
          await updateDoc(doc(db, 'messages', id), { pinned: true });
          showToast('মেসেজ পিন করা হয়েছে 📌');
        } else if (a === 'rep') {
          currentReply = { id, senderName: row.querySelector('.b-sender')?.textContent || 'ব্যবহারকারী', text: row.querySelector('.bubble')?.innerText || 'ফাইল' };
          els.repUser.textContent = `উত্তরে: ${currentReply.senderName}`;
          els.repTxt.textContent = currentReply.text;
          els.replyBox.classList.add('show');
        }
      }
    };

    els.btnCancelRep.onclick = () => { currentReply = null; els.replyBox.classList.remove('show'); };
    els.btnCloseImgModal.onclick = () => els.imgModal.classList.remove('show');
    els.btnAttach.onclick = e => { e.stopPropagation(); els.attachMenu.classList.toggle('show'); };
    document.onclick = () => { els.attachMenu.classList.remove('show'); els.emojiPop.classList.remove('show'); };
  </script>
</body>
</html>
