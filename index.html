<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌸 Kawaii Chat & Call</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-body: 'Inter', sans-serif;
      --font-head: 'Sora', sans-serif;
      --bg-dark: #0f0d1b;
      --card-bg: rgba(28, 23, 48, 0.88);
      --input-bg: rgba(18, 15, 33, 0.95);
      --pink: #f472b6;
      --pink-glow: rgba(244, 114, 182, 0.4);
      --cute-grad: linear-gradient(135deg, #f472b6 0%, #c084fc 50%, #6366f1 100%);
      --bubble-grad: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      --glass-border: rgba(255, 255, 255, 0.12);
      --online: #10b981;
      --text: #fdf2f8;
      --muted: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: var(--font-body); font-size: 14px; }

    .mesh-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(circle at 10% 20%, rgba(244, 114, 182, 0.18) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.18) 0%, transparent 40%), var(--bg-dark);
    }

    #app { position: relative; z-index: 1; width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; }

    /* CHAT LAYOUT */
    .chat-layout {
      width: 100%; height: 100%; max-width: 900px; display: flex; flex-direction: column;
      background: rgba(18, 15, 30, 0.65); border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
    }

    /* HEADER */
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--card-bg); border-bottom: 1px solid var(--glass-border); z-index: 10;
    }
    .user-profile-btn {
      display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; color: inherit; text-align: left;
    }
    .avatar {
      position: relative; width: 40px; height: 40px; border-radius: 14px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff;
    }
    .online-dot {
      position: absolute; bottom: -2px; right: -2px; width: 11px; height: 11px;
      background: var(--online); border: 2px solid var(--bg-dark); border-radius: 50%;
    }
    .user-text h2 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .user-text span { font-size: 11px; color: var(--pink); display: block; }

    .hdr-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05); color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 15px; transition: 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .call-btn-audio { color: #38bdf8; }
    .call-btn-video { color: #f472b6; }

    /* MESSAGES AREA */
    .msg-area {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px; display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }
    .msg-area::-webkit-scrollbar { width: 4px; }
    .msg-area::-webkit-scrollbar-thumb { background: rgba(244, 114, 182, 0.2); border-radius: 8px; }

    /* BUBBLES */
    .msg-row { display: flex; gap: 6px; max-width: 85%; animation: popBubble 0.18s ease; }
    .msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    @keyframes popBubble { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .b-wrap { position: relative; display: flex; flex-direction: column; }
    .b-sender { font-size: 11px; font-weight: 700; color: var(--pink); margin: 0 0 2px 6px; }
    .bubble {
      position: relative; padding: 9px 13px; border-radius: 18px; word-break: break-word; font-size: 13.5px; line-height: 1.4;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .msg-row.own .bubble { background: var(--bubble-grad); color: #fff; border-bottom-right-radius: 3px; }
    .msg-row.other .bubble { background: var(--card-bg); color: var(--text); border-bottom-left-radius: 3px; border: 1px solid var(--glass-border); }

    .b-quote {
      background: rgba(0,0,0,0.25); border-left: 3px solid #fff; border-radius: 6px;
      padding: 3px 6px; margin-bottom: 4px; font-size: 10.5px; cursor: pointer;
    }
    .b-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; font-size: 9.5px; opacity: 0.75; }

    .msg-img { max-width: 240px; max-height: 250px; border-radius: 12px; cursor: zoom-in; display: block; }
    .v-player { display: flex; align-items: center; gap: 8px; min-width: 190px; padding: 2px 0; }
    .v-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: #fff;
      color: var(--pink); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 13px;
    }
    .msg-row.other .v-btn { background: var(--cute-grad); color: #fff; }

    /* FOOTER */
    .chat-footer { position: relative; background: var(--card-bg); border-top: 1px solid var(--glass-border); padding: 8px 10px; }
    .reply-bar {
      display: none; justify-content: space-between; align-items: center;
      padding: 4px 8px; font-size: 11.5px; color: var(--pink); border-left: 3px solid var(--pink); margin-bottom: 6px;
    }
    .reply-bar.show { display: flex; }

    .input-row { display: flex; align-items: flex-end; gap: 6px; }
    .inp-box {
      flex: 1; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 18px;
      padding: 6px 12px; display: flex; align-items: center;
    }
    .chat-txt {
      width: 100%; max-height: 85px; min-height: 24px; height: 24px; background: transparent;
      border: none; color: #fff; font-size: 13.5px; font-family: var(--font-body); resize: none; outline: none;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 12px; background: var(--cute-grad);
      border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .rec-box {
      display: none; align-items: center; justify-content: space-between;
      background: rgba(30, 24, 46, 0.95); border: 1px solid rgba(244, 114, 182, 0.4); border-radius: 18px; padding: 6px 12px;
    }
    .rec-box.show { display: flex; }
    .rec-dot { width: 10px; height: 10px; background: var(--pink); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    .popover {
      position: absolute; bottom: 56px; background: rgba(25, 20, 42, 0.96);
      border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none; z-index: 30;
    }
    .popover.show { display: flex; }
    .attach-menu { left: 10px; flex-direction: column; padding: 6px; width: 160px; gap: 3px; }
    .att-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: none;
      border: none; color: var(--text); font-size: 12.5px; border-radius: 8px; cursor: pointer; text-align: left;
    }
    .att-item:hover { background: rgba(244, 114, 182, 0.15); }

    .emoji-pop { left: 40px; width: 280px; max-height: 220px; flex-direction: column; padding: 8px; }
    .emoji-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .e-btn { background: none; border: none; font-size: 19px; padding: 4px; cursor: pointer; border-radius: 6px; }

    /* ════════════ LIVE WEBRTC CALLING OVERLAY ════════════ */
    .call-overlay {
      position: fixed; inset: 0; background: #0c0a17; z-index: 20000;
      display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 16px 36px;
    }
    .call-overlay.show { display: flex; }

    .call-header-info { text-align: center; margin-top: 10px; z-index: 10; }
    .call-user-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: #fff; }
    .call-timer-badge { font-size: 12px; color: var(--pink); font-weight: 600; margin-top: 4px; }

    .video-viewport {
      position: relative; width: 100%; max-width: 440px; flex: 1; border-radius: 24px;
      overflow: hidden; background: #17132a; margin: 16px 0; border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
    }
    video#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    video#localVideo {
      position: absolute; bottom: 14px; right: 14px; width: 105px; height: 140px;
      border-radius: 16px; object-fit: cover; border: 2px solid var(--pink);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 5;
    }
    .audio-call-avatar {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .audio-call-avatar .big-avatar {
      width: 90px; height: 90px; border-radius: 30px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; font-size: 38px;
      box-shadow: 0 0 35px var(--pink-glow); animation: pulseAvatar 2s infinite alternate;
    }
    @keyframes pulseAvatar { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

    .call-actions-row {
      display: flex; align-items: center; justify-content: center; gap: 18px; z-index: 10;
    }
    .call-act-btn {
      width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.15s;
    }
    .call-act-btn:active { transform: scale(0.92); }
    .btn-hangup { background: #ef4444; color: #fff; box-shadow: 0 4px 18px rgba(239, 68, 68, 0.4); }
    .btn-mute { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .btn-mute.off { background: #f59e0b; }

    /* 🔔 ইনকামিং কল স্ক্রিন */
    .incoming-modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      z-index: 25000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .incoming-modal.show { display: flex; }
    .incoming-card {
      width: 100%; max-width: 320px; background: #18142b; border: 1px solid var(--pink);
      border-radius: 26px; padding: 26px 20px; text-align: center; box-shadow: 0 0 40px var(--pink-glow);
    }
    .inc-avatar {
      width: 65px; height: 65px; border-radius: 22px; background: var(--cute-grad);
      display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px;
      animation: pulseAvatar 1.5s infinite alternate;
    }
    .inc-actions { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
    .inc-btn {
      width: 54px; height: 54px; border-radius: 50%; border: none; font-size: 22px; color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s;
    }
    .inc-accept { background: #10b981; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4); }
    .inc-reject { background: #ef4444; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4); }

    /* MODAL */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 300px; background: #171427; border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); text-align: center;
    }
    .inp-cute {
      width: 100%; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      color: #fff; font-size: 13.5px; margin: 12px 0; outline: none;
    }
    .btn-cute {
      width: 100%; padding: 10px; border-radius: 10px; background: var(--cute-grad); color: #fff; font-weight: 700; border: none; cursor: pointer;
    }

    .toast-box { position: fixed; top: 12px; right: 12px; z-index: 99999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .toast {
      pointer-events: auto; padding: 9px 13px; background: rgba(25, 20, 42, 0.95);
      border: 1px solid var(--pink); border-radius: 10px; color: #fff; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="mesh-bg"></div>
  <div id="toastBox" class="toast-box"></div>

  <!-- 🔔 ইনকামিং কল মডাল -->
  <div id="incomingModal" class="incoming-modal">
    <div class="incoming-card">
      <div class="inc-avatar" id="incAvatar">🌸</div>
      <h3 id="incCallerName" style="font-family:var(--font-head); font-size:16px;">ফ্রেন্ড</h3>
      <p id="incCallType" style="font-size:12px; color:var(--muted); margin-top:3px;">কল করছেন...</p>
      <div class="inc-actions">
        <button id="btnIncReject" class="inc-btn inc-reject" title="কেটে দিন">✕</button>
        <button id="btnIncAccept" class="inc-btn inc-accept" title="রিসিভ করুন">📞</button>
      </div>
    </div>
  </div>

  <!-- 🎥 লাইভ কলিং ওভারলে -->
  <div id="callOverlay" class="call-overlay">
    <div class="call-header-info">
      <h2 id="activeCallTarget" class="call-user-title">ফ্রেন্ড</h2>
      <div id="activeCallTimer" class="call-timer-badge">সংযুক্ত হচ্ছে... 🌸</div>
    </div>

    <div class="video-viewport">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>

      <div id="audioCallDisplay" class="audio-call-avatar" style="display:none;">
        <div class="big-avatar">🌸</div>
        <p style="color:var(--muted); font-size:12px;">লাইভ অডিও কল চলছে</p>
      </div>
    </div>

    <div class="call-actions-row">
      <button id="btnToggleMic" class="call-act-btn btn-mute" title="মাইক মিউট/অন">🎤</button>
      <button id="btnHangup" class="call-act-btn btn-hangup" title="কল শেষ করুন">✕</button>
      <button id="btnToggleCam" class="call-act-btn btn-mute" title="ক্যামেরা অন/অফ">📷</button>
    </div>
  </div>

  <div id="app">
    <div class="chat-layout">
      <!-- HEADER -->
      <header class="chat-header">
        <button id="btnProfile" class="user-profile-btn" title="নাম পরিবর্তন করতে ট্যাপ করুন">
          <div class="avatar" id="hdrAvatar">🌸<div class="online-dot"></div></div>
          <div class="user-text">
            <h2 id="hdrName">লোড হচ্ছে... ✏️</h2>
            <span>অনলাইন 💖 (গেস্ট মোড)</span>
          </div>
        </button>
        <div class="hdr-actions">
          <button id="btnStartAudioCall" class="icon-btn call-btn-audio" title="অডিও কল">📞</button>
          <button id="btnStartVideoCall" class="icon-btn call-btn-video" title="ভিডিও কল">🎥</button>
          <button id="btnSound" class="icon-btn" title="সাউন্ড অন/অফ">🔔</button>
        </div>
      </header>

      <!-- MESSAGES LIST -->
      <div id="msgArea" class="msg-area"></div>

      <!-- FOOTER -->
      <footer class="chat-footer">
        <div id="replyBar" class="reply-bar">
          <span id="repText">উত্তরে: ...</span>
          <button id="btnCancelRep" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
        </div>

        <div class="input-row">
          <button id="btnAttach" class="icon-btn" type="button">📎</button>
          <button id="btnEmoji" class="icon-btn" type="button">😀</button>

          <div class="inp-box">
            <textarea id="chatInput" class="chat-txt" placeholder="মিষ্টি মেসেজ লিখুন..." rows="1"></textarea>
          </div>

          <button id="btnMic" class="icon-btn" type="button">🎤</button>
          <button id="btnSend" class="send-btn" type="button" disabled>➤</button>
        </div>

        <div id="recBox" class="rec-box">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="rec-dot"></div>
            <span id="recTimer" style="font-weight:700; font-size:12px;">00:00</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button id="btnCancelRec" class="icon-btn" style="color:#ef4444;">✕</button>
            <button id="btnSendRec" class="send-btn">➤</button>
          </div>
        </div>

        <input id="camInput" type="file" accept="image/*" capture="environment" style="display:none;" />
        <input id="galleryInput" type="file" accept="image/*" style="display:none;" />

        <div id="attachMenu" class="popover attach-menu">
          <button id="btnCam" class="att-item" type="button">📸 ক্যামেরা দিয়ে ছবি</button>
          <button id="btnGallery" class="att-item" type="button">🖼️ গ্যালারি ছবি</button>
        </div>

        <div id="emojiPop" class="popover emoji-pop">
          <div id="emojiGrid" class="emoji-grid"></div>
        </div>
      </footer>
    </div>
  </div>

  <div id="profileModal" class="modal">
    <div class="modal-card">
      <h3 style="font-size:14px; font-family:var(--font-head);">🌸 আপনার মিষ্টি নাম লিখুন</h3>
      <input id="inpNewName" class="inp-cute" placeholder="যেমন: কিউট প্রিন্সেস / রাজকুমার" maxlength="20" />
      <button id="btnSaveName" class="btn-cute">সেভ করুন ✨</button>
    </div>
  </div>

  <!-- ════════════ WEBRTC & FIREBASE ENGINE ════════════ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, doc, updateDoc, setDoc, getDoc, deleteDoc,
      serverTimestamp, query, orderBy, limit, onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmLJ5Vdd6Pqm-FrPfANvjy1TZkhG1mxns",
      authDomain: "good-865a2.firebaseapp.com",
      projectId: "good-865a2",
      storageBucket: "good-865a2.firebasestorage.app",
      messagingSenderId: "367706014019",
      appId: "1:367706014019:web:f4e33a639f4573262baff6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const els = {
      hdrName: document.getElementById('hdrName'),
      btnProfile: document.getElementById('btnProfile'),
      profileModal: document.getElementById('profileModal'),
      inpNewName: document.getElementById('inpNewName'),
      btnSaveName: document.getElementById('btnSaveName'),
      btnSound: document.getElementById('btnSound'),
      msgArea: document.getElementById('msgArea'),
      replyBar: document.getElementById('replyBar'),
      repText: document.getElementById('repText'),
      btnCancelRep: document.getElementById('btnCancelRep'),
      btnAttach: document.getElementById('btnAttach'),
      attachMenu: document.getElementById('attachMenu'),
      btnCam: document.getElementById('btnCam'),
      btnGallery: document.getElementById('btnGallery'),
      camInput: document.getElementById('camInput'),
      galleryInput: document.getElementById('galleryInput'),
      btnEmoji: document.getElementById('btnEmoji'),
      emojiPop: document.getElementById('emojiPop'),
      emojiGrid: document.getElementById('emojiGrid'),
      chatInput: document.getElementById('chatInput'),
      btnSend: document.getElementById('btnSend'),
      btnMic: document.getElementById('btnMic'),
      recBox: document.getElementById('recBox'),
      recTimer: document.getElementById('recTimer'),
      btnCancelRec: document.getElementById('btnCancelRec'),
      btnSendRec: document.getElementById('btnSendRec'),
      toastBox: document.getElementById('toastBox'),

      btnStartAudioCall: document.getElementById('btnStartAudioCall'),
      btnStartVideoCall: document.getElementById('btnStartVideoCall'),
      callOverlay: document.getElementById('callOverlay'),
      activeCallTarget: document.getElementById('activeCallTarget'),
      activeCallTimer: document.getElementById('activeCallTimer'),
      localVideo: document.getElementById('localVideo'),
      remoteVideo: document.getElementById('remoteVideo'),
      audioCallDisplay: document.getElementById('audioCallDisplay'),
      btnToggleMic: document.getElementById('btnToggleMic'),
      btnHangup: document.getElementById('btnHangup'),
      btnToggleCam: document.getElementById('btnToggleCam'),

      incomingModal: document.getElementById('incomingModal'),
      incCallerName: document.getElementById('incCallerName'),
      incCallType: document.getElementById('incCallType'),
      btnIncAccept: document.getElementById('btnIncAccept'),
      btnIncReject: document.getElementById('btnIncReject')
    };

    let currentUser = null;
    let activeReply = null;
    let isSoundOn = true;
    let mediaRecorder = null;
    let audioChunks = [];
    let recStartTime = 0;
    let recTimerInterval = null;

    // WebRTC State
    let peerConnection = null;
    let localStream = null;
    let activeCallType = 'video';
    let callTimerInterval = null;
    let callStartTime = 0;
    let isMuted = false;
    let isCamOff = false;
    let ringtoneAudio = null;

    const rtcConfig = {
      iceServers: [
        { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
      ]
    };

    const EMOJIS = ["😀","🥰","😘","😍","😊","🤩","🌸","💖","🎀","🥺","✨","🐱","🐰","👍","👏","🙌","🙏","🎉","🎂","⭐","🍓","🍭","🍫","🥳","🌹"];

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      els.toastBox.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 3000);
    }

    // 🔒 অটো গেস্ট লগইন
    async function initAutoGuest() {
      let myName = localStorage.getItem('kawaii_user_name') || ('মিষ্টি ফ্রেন্ড ' + Math.floor(100 + Math.random() * 900));
      localStorage.setItem('kawaii_user_name', myName);
      els.hdrName.textContent = myName + " ✏️";

      try {
        await signInAnonymously(auth);
      } catch (err) {
        currentUser = { uid: localStorage.getItem('kawaii_user_uid') || 'guest_' + Date.now(), displayName: myName };
        localStorage.setItem('kawaii_user_uid', currentUser.uid);
        startListeningMessages();
        listenIncomingCalls();
      }
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        currentUser.displayName = localStorage.getItem('kawaii_user_name') || 'মিষ্টি ফ্রেন্ড';
        startListeningMessages();
        listenIncomingCalls();
      }
    });

    els.btnProfile.onclick = () => {
      els.inpNewName.value = localStorage.getItem('kawaii_user_name') || '';
      els.profileModal.classList.add('show');
    };
    els.btnSaveName.onclick = () => {
      const n = els.inpNewName.value.trim();
      if (n) {
        localStorage.setItem('kawaii_user_name', n);
        if (currentUser) currentUser.displayName = n;
        els.hdrName.textContent = n + " ✏️";
        showToast('🌸 নাম পরিবর্তন হয়েছে!');
      }
      els.profileModal.classList.remove('show');
    };

    /* ════════════ মেসেজিং ইঞ্জিন ════════════ */
    function startListeningMessages() {
      const q = query(collection(db, 'messages'), orderBy('createdAt', 'asc'), limit(60));
      onSnapshot(q, snap => {
        snap.docChanges().forEach(change => {
          const m = { id: change.doc.id, ...change.doc.data() };
          if (change.type === 'added') appendBubble(m);
        });
        els.msgArea.scrollTop = els.msgArea.scrollHeight;
      });
    }

    function appendBubble(m) {
      if (document.getElementById(`msg-${m.id}`)) return;
      const isOwn = currentUser && m.senderId === currentUser.uid;
      const row = document.createElement('div');
      row.className = `msg-row ${isOwn ? 'own' : 'other'}`;
      row.id = `msg-${m.id}`;

      let content = m.type === 'image' 
        ? `<img src="${m.mediaUrl}" class="msg-img" loading="lazy" />`
        : (m.type === 'voice' 
            ? `<div class="v-player" data-u="${m.mediaUrl}"><button class="v-btn" type="button">▶</button><span>ভয়েস (${m.duration||0}s)</span></div>`
            : `<div>${m.text || ''}</div>`);

      row.innerHTML = `
        <div class="b-wrap">
          ${!isOwn ? `<div class="b-sender">${m.senderName || 'ফ্রেন্ড'}</div>` : ''}
          <div class="bubble">${content}<div class="b-meta"><span>✓✓</span></div></div>
        </div>`;
      els.msgArea.appendChild(row);
    }

    async function sendMessage(text = '', type = 'text', mediaUrl = null) {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, 'messages'), {
          text, type, mediaUrl,
          senderId: currentUser.uid,
          senderName: currentUser.displayName || 'ফ্রেন্ড',
          createdAt: serverTimestamp(),
          replyTo: activeReply
        });
        activeReply = null; els.replyBar.classList.remove('show');
      } catch (e) { showToast('মেসেজ যায়নি'); }
    }

    els.btnSend.onclick = () => {
      const t = els.chatInput.value.trim();
      if (!t) return;
      sendMessage(t, 'text');
      els.chatInput.value = ''; els.chatInput.style.height = '24px'; els.btnSend.disabled = true;
    };
    els.chatInput.oninput = () => {
      els.chatInput.style.height = 'auto';
      els.chatInput.style.height = Math.min(els.chatInput.scrollHeight, 85) + 'px';
      els.btnSend.disabled = !els.chatInput.value.trim();
    };

    /* ════════════ ৩. ফিক্সড অডিও ও ভিডিও কলিং (WebRTC) ════════════ */
    els.btnStartAudioCall.onclick = () => startCall('audio');
    els.btnStartVideoCall.onclick = () => startCall('video');

    async function startCall(type) {
      // সিকিউরিটি চেক: মোবাইল ব্রাউজারে HTTPS নিশ্চিত করা
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        alert('⚠️ মোবাইলে ক্যামেরা ও কথা চালু করার জন্য লিঙ্কটি অবশ্যই HTTPS হতে হবে (যেমন: GitHub Pages, Vercel বা Netlify-এ হোস্ট করা)।');
      }

      activeCallType = type;
      showToast(type === 'video' ? '🎥 ভিডিও কল শুরু হচ্ছে...' : '📞 অডিও কল শুরু হচ্ছে...');

      const streamReady = await setupLocalMedia(type);
      if (!streamReady) return;

      setupCallUI(type, 'কল যাচ্ছে...', true);

      // পুরনো কল ডাটা ক্লিয়ার করা
      await clearOldCallData();

      peerConnection = new RTCPeerConnection(rtcConfig);
      registerPeerEvents();

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      // ICE Candidates হ্যান্ডলার
      peerConnection.onicecandidate = e => {
        if (e.candidate) {
          addDoc(collection(db, 'calls', 'live_channel', 'callerCandidates'), e.candidate.toJSON());
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      const callDoc = doc(db, 'calls', 'live_channel');
      await setDoc(callDoc, {
        callerId: currentUser.uid,
        callerName: currentUser.displayName || 'ফ্রেন্ড',
        type: type,
        status: 'calling',
        offer: { type: offer.type, sdp: offer.sdp },
        createdAt: Date.now()
      });

      // অ্যান্সার শোনা
      const unsubCall = onSnapshot(callDoc, async snap => {
        const data = snap.data();
        if (data && data.status === 'connected' && data.answer && !peerConnection.currentRemoteDescription) {
          const answerDesc = new RTCSessionDescription(data.answer);
          await peerConnection.setRemoteDescription(answerDesc);
          startCallTimer();
        } else if (data && data.status === 'ended') {
          hangupCall(false);
          unsubCall();
        }
      });

      // Callee Candidates যোগ করা
      onSnapshot(collection(db, 'calls', 'live_channel', 'calleeCandidates'), snap => {
        snap.docChanges().forEach(change => {
          if (change.type === 'added') {
            peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });
    }

    function listenIncomingCalls() {
      const callDoc = doc(db, 'calls', 'live_channel');
      onSnapshot(callDoc, snap => {
        const data = snap.data();
        if (data && data.status === 'calling' && data.callerId !== currentUser?.uid) {
          if (Date.now() - data.createdAt > 45000) return; // ৪৫ সেকেন্ডের বেশি হলে কল বাতিল

          els.incCallerName.textContent = data.callerName;
          els.incCallType.textContent = data.type === 'video' ? '🎥 ভিডিও কল করছেন...' : '📞 অডিও কল করছেন...';
          els.incomingModal.classList.add('show');
          playRingtone(true);

          els.btnIncAccept.onclick = () => acceptIncomingCall(data);
          els.btnIncReject.onclick = () => rejectIncomingCall();
        } else if (data && data.status === 'ended') {
          els.incomingModal.classList.remove('show');
          playRingtone(false);
        }
      });
    }

    async function acceptIncomingCall(callData) {
      els.incomingModal.classList.remove('show');
      playRingtone(false);

      activeCallType = callData.type;
      const streamReady = await setupLocalMedia(callData.type);
      if (!streamReady) return;

      setupCallUI(callData.type, callData.callerName, false);

      peerConnection = new RTCPeerConnection(rtcConfig);
      registerPeerEvents();

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.onicecandidate = e => {
        if (e.candidate) {
          addDoc(collection(db, 'calls', 'live_channel', 'calleeCandidates'), e.candidate.toJSON());
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      const callDoc = doc(db, 'calls', 'live_channel');
      await updateDoc(callDoc, {
        answer: { type: answer.type, sdp: answer.sdp },
        status: 'connected'
      });

      onSnapshot(collection(db, 'calls', 'live_channel', 'callerCandidates'), snap => {
        snap.docChanges().forEach(change => {
          if (change.type === 'added') {
            peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });

      startCallTimer();
    }

    async function rejectIncomingCall() {
      els.incomingModal.classList.remove('show');
      playRingtone(false);
      try {
        await updateDoc(doc(db, 'calls', 'live_channel'), { status: 'ended' });
      } catch (e) {}
    }

    async function setupLocalMedia(type) {
      try {
        const constraints = {
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: type === 'video' ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
        };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        els.localVideo.srcObject = localStream;
        await els.localVideo.play().catch(e => console.log(e));
        return true;
      } catch (err) {
        console.error(err);
        alert('ক্যামেরা বা মাইক্রোফোন ওপেন করা যায়নি। অনুগ্রহ করে ব্রাউজার পারমিশন চেক করুন।');
        return false;
      }
    }

    // সরাসরি ভিডিও স্ট্রিম বাইন্ডিং ও অটো-প্লে
    function registerPeerEvents() {
      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          els.remoteVideo.srcObject = event.streams[0];
          els.remoteVideo.play().catch(e => console.log("Video Play Error:", e));
        }
      };
    }

    function setupCallUI(type, targetName, isCaller) {
      els.callOverlay.classList.add('show');
      els.activeCallTarget.textContent = targetName;
      els.activeCallTimer.textContent = isCaller ? 'কল যাচ্ছে... 🌸' : 'সংযুক্ত...';

      if (type === 'audio') {
        els.localVideo.style.display = 'none';
        els.remoteVideo.style.display = 'none';
        els.audioCallDisplay.style.display = 'flex';
      } else {
        els.localVideo.style.display = 'block';
        els.remoteVideo.style.display = 'block';
        els.audioCallDisplay.style.display = 'none';
      }
    }

    function startCallTimer() {
      callStartTime = Date.now();
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - callStartTime) / 1000);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        els.activeCallTimer.textContent = `কথা চলছে: ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }, 1000);
    }

    els.btnHangup.onclick = () => hangupCall(true);

    async function hangupCall(notifyFirebase = true) {
      if (callTimerInterval) clearInterval(callTimerInterval);
      playRingtone(false);

      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      els.localVideo.srcObject = null;
      els.remoteVideo.srcObject = null;
      els.callOverlay.classList.remove('show');
      showToast('কল শেষ হয়েছে');

      if (notifyFirebase) {
        try {
          await updateDoc(doc(db, 'calls', 'live_channel'), { status: 'ended' });
        } catch (e) {}
      }
    }

    // পুরনো কল মেমোরি ক্লিয়ার
    async function clearOldCallData() {
      try {
        const callerCands = await getDocs(collection(db, 'calls', 'live_channel', 'callerCandidates'));
        callerCands.forEach(d => deleteDoc(d.ref));
        const calleeCands = await getDocs(collection(db, 'calls', 'live_channel', 'calleeCandidates'));
        calleeCands.forEach(d => deleteDoc(d.ref));
      } catch (e) {}
    }

    els.btnToggleMic.onclick = () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      els.btnToggleMic.textContent = isMuted ? '🔇' : '🎤';
      els.btnToggleMic.classList.toggle('off', isMuted);
    };

    els.btnToggleCam.onclick = () => {
      if (!localStream || activeCallType === 'audio') return;
      isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      els.btnToggleCam.textContent = isCamOff ? '🚫' : '📷';
      els.btnToggleCam.classList.toggle('off', isCamOff);
    };

    function playRingtone(start) {
      if (!start) {
        if (ringtoneAudio) { clearInterval(ringtoneAudio); ringtoneAudio = null; }
        return;
      }
      if (ringtoneAudio) return;
      ringtoneAudio = setInterval(() => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.setValueAtTime(480, ctx.currentTime);
          o.frequency.setValueAtTime(440, ctx.currentTime + 0.2);
          g.gain.setValueAtTime(0.08, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          o.start(); o.stop(ctx.currentTime + 0.4);
        } catch (e) {}
      }, 1200);
    }

    /* ════════════ ৪. ক্যামেরা, গ্যালারি ও ভয়েস ════════════ */
    els.btnAttach.onclick = (e) => { e.stopPropagation(); els.attachMenu.classList.toggle('show'); };
    els.btnCam.onclick = () => { els.attachMenu.classList.remove('show'); els.camInput.click(); };
    els.btnGallery.onclick = () => { els.attachMenu.classList.remove('show'); els.galleryInput.click(); };

    els.camInput.onchange = els.galleryInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (file) {
        showToast('ছবি প্রস্তুত হচ্ছে...');
        const base64 = await fastCompressImage(file);
        sendMessage('', 'image', base64);
      }
      e.target.value = '';
    };

    function fastCompressImage(file) {
      return new Promise((resolve) => {
        const r = new FileReader(); r.readAsDataURL(file);
        r.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height, max = 450;
            if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
            else if (h > max) { w = Math.round((w * max) / h); h = max; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
      });
    }

    els.btnMic.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const r = new FileReader();
          r.onloadend = () => sendMessage('', 'voice', r.result, { duration: Math.round((Date.now()-recStartTime)/1000) });
          r.readAsDataURL(blob);
        };
        mediaRecorder.start();
        recStartTime = Date.now();
        els.recBox.classList.add('show');
        recTimerInterval = setInterval(() => {
          const s = Math.floor((Date.now() - recStartTime) / 1000);
          els.recTimer.textContent = `00:${s < 10 ? '0' : ''}${s}`;
        }, 500);
      } catch (err) { showToast('মাইক্রোফোন অনুমতি দিন'); }
    };

    els.btnCancelRec.onclick = () => {
      clearInterval(recTimerInterval);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.ondataavailable = null; mediaRecorder.stop();
      }
      els.recBox.classList.remove('show');
    };
    els.btnSendRec.onclick = () => {
      clearInterval(recTimerInterval);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      els.recBox.classList.remove('show');
    };

    els.btnEmoji.onclick = (e) => { e.stopPropagation(); els.emojiPop.classList.toggle('show'); };
    els.emojiGrid.innerHTML = EMOJIS.map(em => `<button class="e-btn" type="button">${em}</button>`).join('');
    els.emojiGrid.onclick = e => {
      if (e.target.classList.contains('e-btn')) {
        els.chatInput.value += e.target.textContent;
        els.btnSend.disabled = false;
      }
    };

    els.msgArea.onclick = async e => {
      const vBtn = e.target.closest('.v-btn');
      if (vBtn) {
        const p = vBtn.closest('.v-player');
        const audio = new Audio(p.dataset.u);
        vBtn.textContent = '⏸'; audio.play();
        audio.onended = () => vBtn.textContent = '▶';
      }
    };

    document.onclick = () => { els.attachMenu.classList.remove('show'); els.emojiPop.classList.remove('show'); };

    initAutoGuest();
  </script>
</body>
</html>
